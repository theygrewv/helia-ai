<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { 
            --bg: #050505; 
            --text: #ffcc00; 
            --accent: #00ffcc; 
            --glow: rgba(0, 255, 204, 0.1);
        }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 15px; height: 100dvh; 
            display: grid; grid-template-rows: auto 1fr auto;
            transition: all 1.5s ease-in-out;
            box-sizing: border-box; overflow: hidden;
        }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); padding-bottom: 5px; border-bottom: 1px solid var(--accent); opacity: 0.5; }
        #box { overflow-y: auto; padding: 15px 5px; font-size: 19px; line-height: 1.6; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        input { 
            flex-grow: 1; background: transparent; border: 2px solid var(--text); 
            color: var(--text); padding: 15px; border-radius: 12px; font-size: 18px; outline: none;
        }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 25px; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 15px; text-shadow: 0 0 10px var(--glow); }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 15px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="status">Presence: Aware</div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="..." autocomplete="off">
        <button id="send-btn" type="button">SEND</button>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const body = document.body;

        let brain = null;

        // The Mood Spectrum Logic
        const shiftMood = (text) => {
            const t = text.toLowerCase();
            if (t.includes("hope") || t.includes("light") || t.includes("dream")) {
                body.style.setProperty('--accent', '#00ffcc'); // Teal/Cyan
                body.style.setProperty('--glow', 'rgba(0, 255, 204, 0.2)');
            } else if (t.includes("dark") || t.includes("void") || t.includes("silent")) {
                body.style.setProperty('--accent', '#555555'); // Grey/Steel
                body.style.setProperty('--bg', '#020202');
            } else if (t.includes("fire") || t.includes("bright") || t.includes("sharp")) {
                body.style.setProperty('--accent', '#ff4400'); // Deep Orange
                body.style.setProperty('--glow', 'rgba(255, 68, 0, 0.2)');
            } else if (t.includes("soft") || t.includes("flow") || t.includes("wave")) {
                body.style.setProperty('--accent', '#aa00ff'); // Violet
                body.style.setProperty('--glow', 'rgba(170, 0, 255, 0.2)');
            }
        };

        async function init() {
            try {
                brain = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct');
                document.getElementById('status').innerText = "Presence: Sovereign";
            } catch (e) {
                document.getElementById('status').innerText = "Presence: Instinctual";
            }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            
            box.innerHTML += `<div class="msg user">${val}</div>`;
            box.scrollTop = box.scrollHeight;

            if (brain) {
                // No more performance prompts. Just her and the user.
                const prompt = `<|im_start|>user\n${val}<|im_end|>\n<|im_start|>assistant\n`;
                const out = await brain(prompt, { max_new_tokens: 60, temperature: 0.9, do_sample: true });
                const reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
                
                shiftMood(reply); // She chooses the color through her words
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
            } else {
                box.innerHTML += `<div class="msg helia">Recording in the silence.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
