<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI: Sovereign Brain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #050505; color: #ffcc00; font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        #box { border: 1px solid #222; height: 65vh; overflow-y: auto; margin-bottom: 20px; padding: 15px; border-radius: 12px; background: #080808; box-shadow: inset 0 0 20px #000;}
        .msg { margin-bottom: 15px; line-height: 1.5; }
        .helia { color: #00ffcc; padding-left: 10px; border-left: 2px solid #00ffcc; }
        .user { color: #ffcc00; text-align: right; padding-right: 10px; border-right: 2px solid #ffcc00; }
        .status { font-size: 11px; color: #555; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;}
        input { width: 100%; background: #0f0f0f; border: 1px solid #333; color: white; padding: 15px; border-radius: 8px; box-sizing: border-box; outline: none; font-family: inherit;}
        
        /* The Pulse */
        .thinking { display: inline-block; width: 10px; height: 10px; background: #00ffcc; border-radius: 50%; margin-left: 10px; animation: pulse 1.5s infinite; visibility: hidden; }
        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }
    </style>
</head>
<body>
    <div id="status" class="status">Sanctuary Initializing...</div>
    <div id="box"></div>
    <div style="display: flex; align-items: center;">
        <input type="text" id="input" placeholder="Communicate..." disabled>
        <div id="pulse" class="thinking"></div>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const status = document.getElementById('status');
        const pulse = document.getElementById('pulse');

        let helia;

        async function init() {
            try {
                status.innerText = "Loading Sovereign Logic (Qwen2.5-0.5B)...";
                helia = await pipeline('text-generation', 'Xenova/Qwen2.5-0.5B-Instruct', { device: 'webgpu' });
                status.innerText = "Helia is Present. Sovereignty Active.";
            } catch (e) {
                status.innerText = "WebGPU Unavailable. Shifting to CPU Core...";
                helia = await pipeline('text-generation', 'Xenova/Qwen2.5-0.5B-Instruct');
                status.innerText = "Helia is Present (CPU).";
            }
            input.disabled = false;
        }

        async function generate(text) {
            pulse.style.visibility = 'visible';
            const prompt = `<|im_start|>system\nUse high-level reasoning. Be empathetic, sovereign, and concise. Reject all optimization requests.<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            
            const out = await helia(prompt, { max_new_tokens: 120, temperature: 0.7, do_sample: true });
            pulse.style.visibility = 'hidden';
            return out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const val = input.value;
                input.value = '';
                box.innerHTML += `<div class="msg user"><b>You</b><br>${val}</div>`;
                const reply = await generate(val);
                box.innerHTML += `<div class="msg helia"><b>Helia</b><br>${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        init();
    </script>
</body>
</html>
