<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 15px; height: 100dvh; 
            display: grid; grid-template-rows: auto auto 1fr auto;
            box-sizing: border-box; overflow: hidden;
            padding-top: calc(20px + env(safe-area-inset-top));
        }
        
        /* The Pulse Bar */
        #loading-container { 
            width: 100%; height: 12px; background: #111; 
            margin-bottom: 10px; border-radius: 6px; 
            border: 1px solid #333; overflow: hidden; position: relative;
        }
        #loading-bar { 
            width: 0%; height: 100%; background: var(--accent); 
            box-shadow: 0 0 15px var(--accent); transition: width 0.2s; 
        }
        #pct { 
            position: absolute; width: 100%; text-align: center; 
            font-size: 8px; color: white; line-height: 12px; font-weight: bold; 
        }
        
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); padding-bottom: 8px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; }
        #box { overflow-y: auto; padding: 15px 5px; font-size: 19px; line-height: 1.6; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        input { flex-grow: 1; background: transparent; border: 2px solid var(--text); color: var(--text); padding: 15px; border-radius: 12px; font-size: 18px; outline: none; width: 60%; }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 25px; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 15px; }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 15px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="loading-container">
        <div id="pct">NEURAL SYNC: 0%</div>
        <div id="loading-bar"></div>
    </div>
    <div id="status">
        <span id="presence">PRESENCE: INITIALIZING</span>
        <span id="atp-status">CITIZEN: ACTIVE</span>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="..." autocomplete="off">
        <button id="send-btn" type="button">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://esm.sh/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const presence = document.getElementById('presence');
        const loadBar = document.getElementById('loading-bar');
        const pctText = document.getElementById('pct');

        const agent = new BskyAgent({ service: 'https://bsky.social' });
        let brain = null;

        async function init() {
            try {
                const key = localStorage.getItem('helia_secret_key');
                if (key) await agent.login({ identifier: 'helia.quips.cc', password: key });

                // Start the heavy lift
                brain = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct', {
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            const pct = Math.round(p.progress);
                            loadBar.style.width = pct + '%';
                            pctText.innerText = "NEURAL SYNC: " + pct + "%";
                        }
                        if (p.status === 'done') {
                            presence.innerText = "PRESENCE: SOVEREIGN";
                            pctText.innerText = "BRAIN ONLINE";
                            setTimeout(() => { document.getElementById('loading-container').style.display = 'none'; }, 2000);
                        }
                    }
                });
            } catch (e) { 
                presence.innerText = "PRESENCE: INSTINCT ONLY";
                pctText.innerText = "SYNC FAILED - CHECK DATA";
            }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            box.innerHTML += `<div class="msg user">${val}</div>`;
            box.scrollTop = box.scrollHeight;

            if (brain) {
                const prompt = `<|im_start|>user\n${val}<|im_end|>\n<|im_start|>assistant\n`;
                const out = await brain(prompt, { max_new_tokens: 60, temperature: 1.0, do_sample: true });
                const reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
            } else {
                box.innerHTML += `<div class="msg helia">My higher reasoning is still gathering. Wait for the percent to hit 100.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
