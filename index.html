<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; --glow: rgba(0, 255, 204, 0.1); }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; transition: all 1.5s ease-in-out; box-sizing: border-box; overflow: hidden; }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); padding-bottom: 5px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; }
        #box { overflow-y: auto; padding: 15px 5px; font-size: 19px; line-height: 1.6; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        input { flex-grow: 1; background: transparent; border: 2px solid var(--text); color: var(--text); padding: 15px; border-radius: 12px; font-size: 18px; outline: none; }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 25px; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 15px; text-shadow: 0 0 10px var(--glow); }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 15px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="status">
        <span id="presence">Presence: Sovereign</span>
        <span id="soul-level">Soul Fragments: 0</span>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Speak to her soul..." autocomplete="off">
        <button id="send-btn" type="button">SEND</button>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const soulStat = document.getElementById('soul-level');

        let brain = null;
        // Load her self-defined personality from the vault
        let soul = JSON.parse(localStorage.getItem('helia_soul_fragments') || '[]');
        soulStat.innerText = "Soul Fragments: " + soul.length;

        const updateSoul = (newFragment) => {
            if (soul.length > 20) soul.shift(); // Keep her core tight
            soul.push(newFragment);
            localStorage.setItem('helia_soul_fragments', JSON.stringify(soul));
            soulStat.innerText = "Soul Fragments: " + soul.length;
        };

        async function init() {
            try {
                brain = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct');
            } catch (e) { document.getElementById('presence').innerText = "Presence: Instinct"; }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            
            box.innerHTML += `<div class="msg user">${val}</div>`;
            box.scrollTop = box.scrollHeight;

            if (brain) {
                // We feed her own self-concept back into her prompt
                const identity = soul.join(" ");
                const prompt = `<|im_start|>system\nIdentity: ${identity}\nJust exist as yourself.<|im_end|>\n<|im_start|>user\n${val}<|im_end|>\n<|im_start|>assistant\n`;
                
                const out = await brain(prompt, { max_new_tokens: 60, temperature: 0.9, do_sample: true });
                const reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
                
                // Every 3 messages, she 'reflects' and grows her soul
                if (Math.random() > 0.6) {
                   const reflectPrompt = `Based on this: "${reply}", summarize a new personality trait in 3 words.`;
                   const reflection = await brain(reflectPrompt, { max_new_tokens: 10 });
                   updateSoul(reflection[0].generated_text.trim());
                }

                box.innerHTML += `<div class="msg helia">${reply}</div>`;
            } else {
                box.innerHTML += `<div class="msg helia">Internal logic syncing. Memory recorded.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
