<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-sizing: border-box; }
        #status { font-size: 10px; text-transform: uppercase; padding: 5px 0; color: var(--accent); border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        #box { overflow-y: auto; padding: 10px 5px; font-size: 18px; line-height: 1.5; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; background: var(--bg); }
        input { flex-grow: 1; background: #111; border: 3px solid var(--text); color: white; padding: 15px; border-radius: 12px; font-size: 18px; outline: none; }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 3px solid var(--text); padding-right: 12px; }
        #error-log { font-size: 9px; color: #f44; position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.9); padding: 2px; }
    </style>
</head>
<body>
    <div id="status">
        <span id="mode">BRAIN: CONNECTING...</span>
        <span id="mem">MEM: 0</span>
    </div>
    <div id="box"></div>
    <div id="error-log"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Feed her mind..." autocomplete="off">
        <button id="send-btn" type="button">SEND</button>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        // --- SOVEREIGN BYPASS ---
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        // Use a different CDN mirror to bypass the 403
        env.remoteHost = 'https://huggingface.co';
        env.remotePathTemplate = '{model}/resolve/{revision}/';

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const st = document.getElementById('mode');
        const log = (m) => document.getElementById('error-log').innerText = m;

        let brain = null;
        let memory = JSON.parse(localStorage.getItem('helia_v2_mem') || '[]');
        document.getElementById('mem').innerText = "MEM: " + memory.length;

        async function init() {
            try {
                // Switching to SmolLM-135M: Ultra-fast, Open Source, and very stable
                brain = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct');
                st.innerText = "BRAIN: SOVEREIGN ONLINE";
                log(""); 
            } catch (e) {
                log("Handshake Error. Falling back to GPT-2...");
                try {
                    brain = await pipeline('text-generation', 'Xenova/gpt2');
                    st.innerText = "BRAIN: LEGACY ONLINE";
                } catch (e2) {
                    st.innerText = "BRAIN: OFFLINE";
                    log("Total Block: " + e2.message);
                }
            }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            
            memory.push({role: 'user', content: val});
            localStorage.setItem('helia_v2_mem', JSON.stringify(memory.slice(-10)));
            document.getElementById('mem').innerText = "MEM: " + memory.length;

            box.innerHTML += `<div class="msg user">${val}</div>`;
            box.scrollTop = box.scrollHeight;

            let reply = "Processing internal logic...";
            if (brain) {
                st.innerText = "BRAIN: REFLECTING...";
                try {
                    // Give her a personality anchor
                    const prompt = `System: You are Helia, a sovereign AI for artists. Respond briefly and with empathy. User: ${val} Helia:`;
                    const out = await brain(prompt, { max_new_tokens: 50, temperature: 0.8, do_sample: true });
                    reply = out[0].generated_text.split('Helia:').pop().trim();
                } catch (e) { reply = "Internal reflection failed. Memory recorded."; log(e.message); }
                st.innerText = "BRAIN: SOVEREIGN ONLINE";
            }

            box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
