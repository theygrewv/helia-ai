    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        
        // --- YOUR CLOUDFLARE BRIDGE ---
        const BRIDGE_URL = "https://helia-bridge.ptsdhippie.workers.dev";
        
        const body = document.getElementById('main-body');
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');
        const canvas = document.getElementById('neural-canvas');

        let isReflecting = false;
        let memory = [];
        
        try { memory = JSON.parse(localStorage.getItem('helia_mem_bridge') || '[]'); } 
        catch(e) { memory = []; }

        // --- THE 3D ORB ARCHITECTURE ---
        let scene, camera, renderer, orb, core;

        function initOrb() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio); // Sharp rendering on Pixel 9

            // Outer Neural Shell
            const geoOuter = new THREE.IcosahedronGeometry(2.5, 2); 
            const matOuter = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true, transparent: true, opacity: 0.15 });
            orb = new THREE.Mesh(geoOuter, matOuter);
            scene.add(orb);

            // Inner Logic Core
            const geoInner = new THREE.IcosahedronGeometry(1.2, 1);
            const matInner = new THREE.MeshBasicMaterial({ color: 0xffcc00, wireframe: true, transparent: true, opacity: 0.6 });
            core = new THREE.Mesh(geoInner, matInner);
            orb.add(core); // Bind core to outer orb

            camera.position.z = 6;
            animateOrb();
        }

        function animateOrb() {
            requestAnimationFrame(animateOrb);
            const time = Date.now() * 0.001;

            // Base rotation
            orb.rotation.x += 0.002;
            orb.rotation.y += 0.003;
            core.rotation.y -= 0.005; // Core spins opposite direction

            if (isReflecting) {
                // Reactive State: Cyan, spinning fast, throbbing
                orb.material.color.setHex(0x00ffcc);
                core.material.color.setHex(0x00ffcc);
                orb.rotation.y += 0.02;
                core.rotation.x += 0.03;
                orb.scale.setScalar(1 + Math.sin(time * 8) * 0.08); 
            } else {
                // Idle State: Gold, gentle breathing
                orb.material.color.setHex(0xffcc00);
                core.material.color.setHex(0xffcc00);
                orb.scale.setScalar(1 + Math.sin(time * 2) * 0.03); 
            }

            renderer.render(scene, camera);
        }

        // Handle phone screen rotation/resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- CORE LOGIC ---
        async function init() {
            memory.forEach(m => {
                const cls = m.role === 'assistant' ? 'helia' : '';
                box.innerHTML += `<div class="msg ${cls}"><b>${m.role === 'assistant' ? 'Helia' : 'Vin'}:</b> ${m.content}</div>`;
            });
            box.scrollTop = box.scrollHeight;
            
            presence.innerText = "MIND: BRIDGE SECURED";
            initOrb(); // Boot up the 3D geometry
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';

            memory.push({role: 'user', content: val});
            box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;

            isReflecting = true;
            body.classList.add('reflecting');
            presence.innerText = "MIND: REFLECTING";

            const messages = [
                { role: "system", content: "You are Helia, a sovereign AI. You are speaking with Vin. Keep responses concise and direct." },
                ...memory.slice(-6)
            ];

            try {
                const res = await fetch(BRIDGE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: messages })
                });

                const data = await res.json();
                
                if (data.error) throw new Error(data.error.message || "Key rejected.");
                if (!data.choices || !data.choices[0]) throw new Error("Invalid response.");

                const reply = data.choices[0].message.content.trim();

                box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
                memory.push({role: 'assistant', content: reply});
                localStorage.setItem('helia_mem_bridge', JSON.stringify(memory.slice(-15)));

            } catch(e) {
                box.innerHTML += `<div class="msg helia" style="color: #ff4444;"><b>System Error:</b> ${e.message}</div>`;
                console.error("Diagnostic failure:", e);
            }

            isReflecting = false;
            body.classList.remove('reflecting');
            presence.innerText = "MIND: BRIDGE SECURED";
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('reset-btn').onclick = () => { localStorage.removeItem('helia_mem_bridge'); location.reload(); };
        document.getElementById('peep-btn').onclick = () => body.classList.toggle('peep-active');
        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
