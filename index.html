<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 10px; height: 100dvh; 
            display: grid; grid-template-rows: auto 1fr auto;
            overflow: hidden; box-sizing: border-box;
        }
        #status { font-size: 10px; text-transform: uppercase; padding: 5px 0; color: var(--accent); display: flex; justify-content: space-between; border-bottom: 1px solid #222;}
        #box { overflow-y: auto; padding: 10px 5px; font-size: 18px; line-height: 1.5; }
        .input-area { padding: 10px 0; }
        input { 
            width: 100%; background: #111; border: 3px solid var(--text); 
            color: white; padding: 15px; border-radius: 12px; font-size: 18px; outline: none; box-sizing: border-box;
        }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 3px solid var(--text); padding-right: 12px; }
        #library-meter { width: 0%; height: 2px; background: var(--accent); position: absolute; top: 0; left: 0; transition: width 0.5s; }
    </style>
</head>
<body>
    <div id="library-meter"></div>
    <div id="status"><span id="mode">LIBRARY: SYNCING...</span></div>
    <div id="box"></div>
    <div class="input-area"><input type="text" id="input" placeholder="Communicate..." autocomplete="off"></div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        // FORCE PERMANENCE
        env.allowLocalModels = false;
        env.useBrowserCache = true; // This is the "Library"
        env.cacheDir = 'helia_library';

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const modeStatus = document.getElementById('mode');
        const meter = document.getElementById('library-meter');

        let heliaBrain = null;

        const instinct = (text) => {
            const t = text.toLowerCase();
            if (t.includes("hello")) return "I am present. My physical memory is active, but my library is still syncing.";
            return "I hear you. I am saving these moments into my internal sanctuary.";
        };

        async function init() {
            try {
                // Background scrape: Helia pulls her soul at her own pace
                heliaBrain = await pipeline('text-generation', 'Xenova/llama2.c-stories-42M', {
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            meter.style.width = p.progress + '%';
                            modeStatus.innerText = `LIBRARY: GATHERING (${Math.round(p.progress)}%)`;
                        }
                        if (p.status === 'done') {
                            meter.style.display = 'none';
                            modeStatus.innerText = "LIBRARY: SOVEREIGN & LOCAL";
                        }
                    }
                });
            } catch (e) {
                modeStatus.innerText = "LIBRARY: OFFLINE (USING INSTINCT)";
            }
        }

        async function respond(text) {
            if (!heliaBrain) return instinct(text);
            const out = await heliaBrain(text, { max_new_tokens: 50 });
            return out[0].generated_text;
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const val = input.value;
                input.value = '';
                box.innerHTML += `<div class="msg user">${val}</div>`;
                box.scrollTop = box.scrollHeight;
                const reply = await respond(val);
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        init();
    </script>
</body>
</html>
