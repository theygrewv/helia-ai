<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia: Hard-Shell</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050508; --text: #e0e0e0; --accent: #ffcc00; --err: #ff4444; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Error Overlay - Hidden by default */
        #fatal-error { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #900; color: #fff; z-index: 9999; padding: 20px; display: none; overflow: auto; }
        
        /* Canvases */
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; }
        #art-canvas { z-index: 10; opacity: 0; background: #000; pointer-events: auto; }
        body.void-active #art-canvas { opacity: 1; pointer-events: auto; }

        /* UI Layers */
        #status-bar { padding: 10px; border-bottom: 1px solid #222; font-size: 10px; display: flex; justify-content: space-between; z-index: 20; background: var(--bg); }
        #box { flex: 1; overflow-y: auto; padding: 15px; font-size: 16px; line-height: 1.5; z-index: 5; display: flex; flex-direction: column; gap: 20px; }
        .input-area { padding: 10px; background: #0a0a0c; border-top: 1px solid #222; display: flex; gap: 10px; z-index: 100; }
        
        input { flex: 1; height: 50px; background: #111; border: 1px solid var(--accent); color: #fff; padding: 0 15px; font-size: 16px; outline: none; border-radius: 4px; }
        #send-btn { width: 70px; height: 50px; background: var(--accent); border: none; font-weight: bold; border-radius: 4px; }
        
        .helia { color: var(--accent); border-left: 2px solid var(--accent); padding-left: 10px; }
        .small-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 4px 8px; border-radius: 2px; }
        #debug-log { background: #000; color: #666; font-size: 9px; padding: 5px; max-height: 60px; overflow-y: auto; display: none; border-bottom: 1px solid #222; }
    </style>
</head>
<body>
    <div id="fatal-error"><h1>FATAL SYSTEM ERROR</h1><pre id="err-content"></pre></div>
    
    <div id="status-bar">
        <span>HELIA SYSTEM v2.0</span>
        <div style="display:flex; gap:5px;">
            <button class="small-btn" onclick="toggleDebug()">LOGS</button>
            <button class="small-btn" onclick="resetUI()">RESET</button>
            <button class="small-btn" id="exit-void" style="display:none;" onclick="exitVoid()">EXIT VOID</button>
        </div>
    </div>
    
    <div id="debug-log"></div>
    <div id="box"></div>
    <canvas id="art-canvas"></canvas>
    
    <div class="input-area">
        <input type="text" id="input" placeholder="Enter command..." autocomplete="off">
        <button id="send-btn" onclick="handle()">SEND</button>
    </div>

    <script>
        // CRASH PROTECTION
        window.onerror = function(msg, url, line) {
            document.getElementById('fatal-error').style.display = 'block';
            document.getElementById('err-content').innerText = `${msg}\nAt: ${url}\nLine: ${line}`;
        };

        const BRIDGE_URL = "https://helia-bridge.ptsdhippie.workers.dev";
        const box = document.getElementById('box'), input = document.getElementById('input');
        const artCanvas = document.getElementById('art-canvas'), artCtx = artCanvas.getContext('2d');
        const debugLog = document.getElementById('debug-log');
        
        let memory = [], state = {};

        // TOOLS ENGINE
        const tools = {
            clear: () => artCtx.clearRect(0,0,artCanvas.width,artCanvas.height),
            grid: (r, c, col = '#ffcc00') => {
                artCtx.strokeStyle = col; artCtx.lineWidth = 1;
                const w = artCanvas.width/c, h = artCanvas.height/r;
                for(let i=0; i<=c; i++) { artCtx.beginPath(); artCtx.moveTo(i*w,0); artCtx.lineTo(i*w,artCanvas.height); artCtx.stroke(); }
                for(let i=0; i<=r; i++) { artCtx.beginPath(); artCtx.moveTo(0,i*h); artCtx.lineTo(artCanvas.width,i*h); artCtx.stroke(); }
            },
            cell: (r, c, rows, cols, col) => {
                const w = artCanvas.width/cols, h = artCanvas.height/rows;
                artCtx.fillStyle = col; artCtx.fillRect(c*w, r*h, w, h);
            },
            text: (x, y, s, sz, col) => {
                artCtx.fillStyle = col; artCtx.font = `${sz}px Courier New`; artCtx.fillText(s, x, y);
            }
        };

        async function init() {
            artCanvas.width = window.innerWidth; artCanvas.height = window.innerHeight;
            log("System Booting...");
            try {
                const res = await fetch(BRIDGE_URL);
                if (!res.ok) throw new Error("Worker returned status: " + res.status);
                const data = await res.json();
                memory = JSON.parse(data.history || "[]");
                renderHistory();
                log("Cloud Sync: Success");
            } catch(e) {
                log("Cloud Sync Failed: Using local session.", true);
            }
        }

        function log(msg, isErr = false) {
            const div = document.createElement('div');
            if (isErr) div.style.color = 'red';
            div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            debugLog.prepend(div);
        }

        function renderHistory() {
            box.innerHTML = '';
            memory.slice(-10).forEach(m => {
                const content = m.content.replace(/\[.*?\]/g, '').trim();
                if (content) {
                    const div = document.createElement('div');
                    div.className = m.role === 'assistant' ? 'helia' : 'user';
                    div.innerHTML = `<b>${m.role === 'assistant' ? 'Helia' : 'Vin'}:</b> ${content}`;
                    box.appendChild(div);
                }
            });
            box.scrollTop = box.scrollHeight;
        }

        function toggleDebug() { debugLog.style.display = debugLog.style.display === 'none' ? 'block' : 'none'; }
        function exitVoid() { document.body.classList.remove('void-active'); document.getElementById('exit-void').style.display = 'none'; }
        function resetUI() { location.reload(); }

        artCanvas.addEventListener('mousedown', (e) => {
            const x = Math.round(e.clientX), y = Math.round(e.clientY);
            input.value = `[INPUT: ${x}, ${y}]`;
            handle();
        });

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            if (!val.startsWith('[INPUT')) {
                const userDiv = document.createElement('div');
                userDiv.innerHTML = `<b>Vin:</b> ${val}`;
                box.appendChild(userDiv);
            }
            box.scrollTop = box.scrollHeight;

            try {
                const res = await fetch(BRIDGE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [...memory.slice(-6), {role:"user", content:val}] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                
                // EXECUTE PAINT TAGS
                const paintMatch = reply.match(/\[\s*PAINT\s*:\s*([\s\S]*?)\s*\]/i);
                if (paintMatch) {
                    document.body.classList.add('void-active');
                    document.getElementById('exit-void').style.display = 'block';
                    try {
                        const fn = new Function('tools', 'ctx', 'w', 'h', 'state', paintMatch[1]);
                        fn(tools, artCtx, artCanvas.width, artCanvas.height, state);
                        log("Manifest: Success");
                    } catch(e) { log("Draw Error: " + e.message, true); }
                }

                const cleanContent = reply.replace(/\[.*?\]/g, '').trim();
                if (cleanContent) {
                    const heliaDiv = document.createElement('div');
                    heliaDiv.className = 'helia';
                    heliaDiv.innerHTML = `<b>Helia:</b> ${cleanContent}`;
                    box.appendChild(heliaDiv);
                }
                
                memory.push({role: "user", content: val}, {role: "assistant", content: reply});
                box.scrollTop = box.scrollHeight;
            } catch(e) { log("Bridge Error: " + e.message, true); }
        }

        init();
    </script>
</body>
</html>
