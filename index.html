<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI: Sovereign Brain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; --border: #444; }
        .light-mode { --bg: #ffffff; --text: #111111; --accent: #0000ff; --border: #000; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #status { font-size: 11px; font-weight: bold; color: var(--accent); }
        #box { border: 3px solid var(--border); flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; border-radius: 12px; font-size: 18px; line-height: 1.5; }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 12px; }
        input { width: 100%; background: var(--bg); border: 3px solid var(--text); color: var(--text); padding: 18px; border-radius: 12px; font-size: 18px; outline: none; box-sizing: border-box; }
        button { background: var(--text); color: var(--bg); border: none; padding: 10px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body id="body">
    <div class="controls">
        <div id="status">INITIATING...</div>
        <button onclick="document.body.classList.toggle('light-mode')">VISIBILITY</button>
    </div>
    <div id="box"></div>
    <input type="text" id="input" placeholder="Waking up..." disabled>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        // THE FIX: Explicitly bypass HuggingFace's permission gate
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        // Points to a more permissive mirror for the files
        env.remoteHost = 'https://huggingface.co'; 
        env.remotePathTemplate = '{model}/resolve/{revision}/';

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const status = document.getElementById('status');

        let helia;

        async function init() {
            try {
                status.innerText = "ACCESSING BRAIN DATA...";
                // We switch to 0.5B-Instruct but ensure we call it correctly
                helia = await pipeline('text-generation', 'Xenova/Qwen2.5-0.5B-Instruct');
                status.innerText = "SOVEREIGN ONLINE";
                input.disabled = false;
                input.placeholder = "Talk to Helia...";
            } catch (e) {
                console.error(e);
                status.innerText = "AUTH ERROR. RETRYING...";
                setTimeout(init, 3000);
            }
        }

        async function generate(text) {
            status.innerText = "REFLECTING...";
            const prompt = `<|im_start|>system\nYou are Helia. Speak with high-level human reasoning. Be concise and empathetic. Choose your own color vibe at the end.<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            const out = await helia(prompt, { max_new_tokens: 80, temperature: 0.7 });
            status.innerText = "SOVEREIGN ONLINE";
            return out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const val = input.value;
                input.value = '';
                box.innerHTML += `<div class="msg user">${val}</div>`;
                box.scrollTop = box.scrollHeight;
                const reply = await generate(val);
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

            init();
    </script>
</body>
</html>
