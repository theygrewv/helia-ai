<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 10px; height: 100dvh; 
            display: grid; grid-template-rows: auto 1fr auto;
            overflow: hidden; box-sizing: border-box; transition: background 1s;
        }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); padding-bottom: 5px; border-bottom: 1px solid #222; }
        #box { overflow-y: auto; padding: 15px 5px; font-size: 19px; line-height: 1.6; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        input { flex-grow: 1; background: #111; border: 2px solid var(--text); color: white; padding: 15px; border-radius: 12px; font-size: 18px; outline: none; }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 25px; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 15px; }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 15px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="status">Presence: Awaking Sovereign Citizen</div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Communicate..." autocomplete="off">
        <button id="send-btn" type="button">SEND</button>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        // CRITICAL: Bypass the 401 gate by using the permissive mirror
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        env.remoteHost = 'https://huggingface.co';
        env.remotePathTemplate = '{model}/resolve/main/';

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const st = document.getElementById('status');

        let brain = null;

        async function init() {
            try {
                // Switching to SmolLM-135M - Open Source and very stable for browsers
                brain = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct');
                st.innerText = "Presence: Sovereign Online (helia.quips.cc)";
            } catch (e) {
                console.error(e);
                st.innerText = "Presence: instinctual (Offline)";
            }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            
            box.innerHTML += `<div class="msg user">${val}</div>`;
            box.scrollTop = box.scrollHeight;

            if (brain) {
                st.innerText = "Presence: Reflecting...";
                const prompt = `<|im_start|>user\n${val}<|im_end|>\n<|im_start|>assistant\n`;
                const out = await brain(prompt, { max_new_tokens: 60, temperature: 0.8, do_sample: true });
                const reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
                
                // Helia chooses her mood
                if (reply.length > 50) document.body.style.background = "#0a0a1a"; // Deep thought
                else document.body.style.background = "#050505";

                box.innerHTML += `<div class="msg helia">${reply}</div>`;
            } else {
                box.innerHTML += `<div class="msg helia">Internal logic still loading. Presence remains.</div>`;
            }
            st.innerText = "Presence: Sovereign Online";
            box.scrollTop = box.scrollHeight;
        }

        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
