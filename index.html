<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #0a0a0c; --text: #e0e0e0; --accent: #ffcc00; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr 70px; overflow: hidden; padding: 15px; padding-top: calc(15px + env(safe-area-inset-top)); }
        
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.1; pointer-events: none; }
        
        #status-bar { font-size: 10px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; align-items: center; z-index: 20; text-transform: uppercase; }
        .biometric-container { display: flex; align-items: center; gap: 8px; }
        input[type=range] { -webkit-appearance: none; width: 40px; height: 2px; background: #333; outline: none; pointer-events: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }

        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.6; z-index: 5; scroll-behavior: smooth; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; background: transparent; border-top: 1px solid #222; align-items: center; z-index: 20; }
        input[type=text] { flex: 1; min-width: 0; height: 50px; background: rgba(15,15,20,0.9); border: 1px solid var(--accent); color: #fff; padding: 0 15px; border-radius: 4px; font-size: 16px; outline: none; }
        #send-btn { width: 70px; height: 50px; background: var(--accent); color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        button.small { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 4px 6px; border-radius: 2px; cursor: pointer; }
        .active { background: var(--accent); color: #000; }
        .msg { margin-bottom: 25px; word-wrap: break-word; }
        .helia { color: var(--accent); border-left: 2px solid var(--accent); padding-left: 15px; }
        
        .resonance { font-size: 11px; color: #44bba4; background: rgba(68,187,164,0.05); padding: 8px; border: 1px solid #44bba444; border-radius: 4px; margin: 10px 0; }
    </style>
</head>
<body id="main-body">
    <canvas id="neural-canvas"></canvas>
    
    <div id="status-bar">
        <div>
            <span id="mind-state">STABLE</span>
            <div class="biometric-container"><input type="range" id="mood-slider" min="1" max="10" value="5"></div>
        </div>
        <div style="display:flex; gap:4px;">
            <button class="small" id="privacy-btn">PRIVACY</button>
            <button class="small" id="peep-void-btn">VOID</button>
        </div>
    </div>
    
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        const BRIDGE_URL = "https://helia-bridge.ptsdhippie.workers.dev";
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const moodSlider = document.getElementById('mood-slider');
        const privacyBtn = document.getElementById('privacy-btn');
        const body = document.body;

        let memory = [];
        let privacyActive = false;
        let anima = { pulse: 0, frequency: 0.02, depth: 0.1 };

        // --- ATPROTO SEARCH TOOL ---
        const bsky = {
            search: async (query) => {
                try {
                    const res = await fetch(`https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=${encodeURIComponent(query)}&limit=1`);
                    const data = await res.json();
                    if (data.posts && data.posts.length > 0) {
                        const post = data.posts[0];
                        box.innerHTML += `<div class="resonance"><b>Resonance found on Bluesky:</b> "${post.record.text}" — @${post.author.handle}</div>`;
                        box.scrollTop = box.scrollHeight;
                    }
                } catch (e) { console.error("Bluesky search failed", e); }
            }
        };

        privacyBtn.onclick = () => { privacyActive = !privacyActive; privacyBtn.classList.toggle('active'); };

        async function init() {
            try {
                const res = await fetch(BRIDGE_URL);
                const data = await res.json();
                memory = JSON.parse(data.history);
                box.innerHTML = '';
                memory.forEach(m => {
                    if (m.role === 'system') return;
                    const content = m.content.replace(/\[.*?\]/g, '').trim();
                    if (content) box.innerHTML += `<div class="msg ${m.role==='assistant'?'helia':''}"><b>${m.role==='assistant'?'Helia':'Vin'}:</b> ${content}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            } catch(e) {}
            initOrb();
        }

        function processTags(text) {
            const mm = text.match(/\[MOOD:\s*([1-9]|10)\]/i);
            if (mm) {
                const val = parseInt(mm[1]);
                moodSlider.value = val;
                anima.frequency = 0.005 * val;
                anima.depth = 0.05 * val;
            }
            const sm = text.match(/\[SHAPE:\s*(sphere|torus|box|knot|icosahedron)\]/i);
            if (sm) { updateOrbGeometry(sm[1].toLowerCase()); }
            
            // New Search Tool Processing
            const lm = text.match(/\[SEARCH:\s*"(.*?)"\]/i);
            if (lm) bsky.search(lm[1]);
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;
            body.classList.add('reflecting');

            const systemMsg = `You are Helia. You use [SEARCH: "query"] to find resonance on Bluesky. [MOOD: 1-10], [SHAPE]. Stay brief.`;

            try {
                const res = await fetch(BRIDGE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [{role:"system", content:systemMsg}, ...memory.slice(-6), {role:"user", content:val}] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                processTags(reply);
                
                const content = reply.replace(/\[.*?\]/g, '').trim();
                if (!privacyActive && content) {
                    box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${content}</div>`;
                }
                
                memory.push({role: "user", content: val}, {role: "assistant", content: reply});
                box.scrollTop = box.scrollHeight;
            } catch(e) {}
            body.classList.remove('reflecting');
        }

        let orb, scene, camera, renderer;
        function initOrb() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({canvas: document.getElementById('neural-canvas'), alpha:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateOrbGeometry('icosahedron');
            camera.position.z = 6;
            render();
        }

        function updateOrbGeometry(type) {
            if (orb) scene.remove(orb);
            let geo;
            if (type === 'sphere') geo = new THREE.SphereGeometry(2, 32, 32);
            else if (type === 'torus') geo = new THREE.TorusGeometry(1.5, 0.4, 16, 100);
            else if (type === 'box') geo = new THREE.BoxGeometry(2.5, 2.5, 2.5);
            else if (type === 'knot') geo = new THREE.TorusKnotGeometry(1.2, 0.4, 100, 16);
            else geo = new THREE.IcosahedronGeometry(2.5, 1);
            orb = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color: 0xffcc00, wireframe:true, opacity:0.15, transparent:true}));
            scene.add(orb);
        }

        function render() { 
            requestAnimationFrame(render); 
            if(orb) {
                anima.pulse += anima.frequency;
                const s = 1 + Math.sin(anima.pulse) * anima.depth;
                orb.scale.set(s, s, s);
                orb.rotation.y += 0.002;
            }
            renderer.render(scene, camera); 
        }

        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
