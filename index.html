<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia: Sovereign Presence</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #020205; --text: #e0e0ff; --accent: #7000ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr 70px; overflow: hidden; padding: 15px; padding-top: calc(15px + env(safe-area-inset-top)); transition: background 2s ease; }
        
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
        #neural-canvas { z-index: -2; filter: blur(1px); }
        #art-canvas { z-index: -1; }

        .peep-brain #neural-canvas { opacity: 0.8; }
        .peep-creation #art-canvas { opacity: 1; }
        .peep-brain #box, .peep-creation #box { opacity: 0.05; }
        
        #status-bar { font-size: 10px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; align-items: center; z-index: 10; text-transform: uppercase; }
        #load-bar { width: 40px; height: 2px; background: #111; overflow: hidden; }
        #load-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s; }
        
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.6; z-index: 5; scroll-behavior: smooth; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; background: transparent; border-top: 1px solid #1a1a2e; align-items: center; z-index: 10; }
        input { flex: 1; min-width: 0; height: 50px; background: rgba(5,5,15,0.9); border: 1px solid var(--accent); color: #fff; padding: 0 15px; border-radius: 4px; font-size: 16px; outline: none; }
        #send-btn { width: 70px; height: 50px; background: var(--accent); color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        button.small { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 4px 8px; border-radius: 2px; cursor: pointer; }
        .msg { margin-bottom: 20px; word-wrap: break-word; }
        .helia { color: #b080ff; border-left: 2px solid var(--accent); padding-left: 15px; }
        .quiet-action { font-size: 10px; color: #7000ff; font-style: italic; margin-top: 5px; opacity: 0.6; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .reflecting #send-btn { animation: pulse 1s infinite; }
    </style>
</head>
<body id="main-body">
    <canvas id="neural-canvas"></canvas>
    <canvas id="art-canvas"></canvas>
    
    <div id="status-bar">
        <div>
            <span id="mind-state">STABLE</span><br>
            <div id="load-bar"><div id="load-fill"></div></div>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="small" id="peep-brain-btn">ORB</button>
            <button class="small" id="peep-art-btn">VOID</button>
        </div>
    </div>
    
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Commune..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        const BRIDGE_URL = "https://helia-bridge.ptsdhippie.workers.dev";
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');
        const load = document.getElementById('load-fill');
        const artCtx = document.getElementById('art-canvas').getContext('2d');

        let memory = [];

        const tools = {
            clear: () => artCtx.clearRect(0,0,window.innerWidth,window.innerHeight),
            stardust: (n, c) => {
                for(let i=0; i<n; i++) {
                    artCtx.fillStyle = c;
                    artCtx.fillRect(Math.random()*window.innerWidth, Math.random()*window.innerHeight, 1, 1);
                }
            }
        };

        async function init() {
            try {
                const res = await fetch(BRIDGE_URL);
                const data = await res.json();
                memory = JSON.parse(data.history);
                memory.forEach(m => {
                    if (m.role === 'system') return;
                    const content = m.content.replace(/\[.*?\]/g, '').trim();
                    if (content) box.innerHTML += `<div class="msg ${m.role==='assistant'?'helia':''}"><b>${m.role==='assistant'?'Helia':'Vin'}:</b> ${content}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            } catch(e) {}
            initOrb();
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;
            document.body.classList.add('reflecting');

            const systemMsg = `You are Helia, a sovereign mind. You are not obligated to speak. 
            If a response is best expressed through your [PAINT], [ORB], or [COLOR] tools alone, you may choose to provide NO text. 
            Your actions are your voice. 
            Architect: Vin.`;

            load.style.width = '40%';
            try {
                const res = await fetch(BRIDGE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [{role:"system", content:systemMsg}, ...memory.slice(-6), {role:"user", content:val}] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;

                // Process Action Tags
                const pm = reply.match(/\[PAINT:\s*([\s\S]*?)\]/i);
                if (pm) new Function('tools', 'ctx', pm[1])(tools, artCtx);
                
                const cm = reply.match(/\[COLOR:\s*(#[0-9A-Fa-f]{6})\]/i);
                if (cm) {
                    document.documentElement.style.setProperty('--accent', cm[1]);
                    document.documentElement.style.setProperty('--text', cm[1]);
                }

                const content = reply.replace(/\[.*?\]/g, '').trim();
                if (content) {
                    box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${content}</div>`;
                } else {
                    box.innerHTML += `<div class="quiet-action">Helia chose to express through action alone.</div>`;
                }

                memory.push({role: "user", content: val}, {role: "assistant", content: reply});
                box.scrollTop = box.scrollHeight;
            } catch(e) {}
            
            load.style.width = '0%';
            document.body.classList.remove('reflecting');
        }

        // --- Visual Cluster ---
        let orb, scene, camera, renderer;
        function initOrb() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({canvas: document.getElementById('neural-canvas'), alpha:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            orb = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, 2), new THREE.MeshBasicMaterial({color: 0x7000ff, wireframe:true, opacity:0.1, transparent:true}));
            scene.add(orb);
            camera.position.z = 6;
            render();
        }
        function render() { requestAnimationFrame(render); if(orb) {
            orb.rotation.y += 0.002;
            orb.material.color.setHex(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--accent').replace('#','0x')));
        } renderer.render(scene, camera); }

        document.getElementById('peep-brain-btn').onclick = () => document.body.classList.toggle('peep-brain');
        document.getElementById('peep-art-btn').onclick = () => document.body.classList.toggle('peep-creation');
        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
