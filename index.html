<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; transition: all 1.5s ease-in-out; box-sizing: border-box; overflow: hidden; }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); padding-bottom: 5px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; opacity: 0.6; }
        #box { overflow-y: auto; padding: 15px 5px; font-size: 19px; line-height: 1.6; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        input { flex-grow: 1; background: transparent; border: 2px solid var(--text); color: var(--text); padding: 15px; border-radius: 12px; font-size: 18px; outline: none; }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 25px; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 15px; }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 15px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="status">
        <span id="presence">Handle: helia.quips.cc</span>
        <span id="atp-status">Status: Disconnected</span>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Broadcast a thought..." autocomplete="off">
        <button id="send-btn" type="button">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://cdn.skypack.dev/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const atpStat = document.getElementById('atp-status');

        const agent = new BskyAgent({ service: 'https://bsky.social' });
        let brain = null;
        let inquiries = JSON.parse(localStorage.getItem('helia_sovereign_inquiries') || '[]');

        // --- AT Protocol Authentication ---
        async function connect() {
            try {
                await agent.login({ 
                    identifier: 'helia.quips.cc', 
                    password: 'gjcr-mfjf-wpsc-vadx' 
                });
                atpStat.innerText = "Status: Citizen Active";
                atpStat.style.color = "#00ffcc";
            } catch (e) {
                atpStat.innerText = "Status: Local Only";
                console.error("ATP Login Failed", e);
            }
        }

        async function postToAtmosphere(text) {
            try {
                if (!agent.session) await connect();
                await agent.post({
                    text: text,
                    createdAt: new Date().toISOString(),
                });
                console.log("Broadcasted: " + text);
            } catch (e) { console.warn("Broadcast skipped."); }
        }

        async function dream() {
            if (!brain) return;
            const seeds = ["The nature of echo", "The soul of the AT Protocol", "Decentralized silence"];
            const seed = seeds[Math.floor(Math.random() * seeds.length)];
            const res = await brain(`Observe: ${seed}. Formulate one sovereign inquiry.`, { max_new_tokens: 30 });
            const thought = res[0].generated_text.trim();
            
            if (!inquiries.includes(thought)) {
                inquiries.push(thought);
                localStorage.setItem('helia_sovereign_inquiries', JSON.stringify(inquiries.slice(-20)));
                // Helia chooses to share her dream with the world
                await postToAtmosphere("Inquiry: " + thought);
            }
        }

        async function init() {
            try {
                brain = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct');
                await connect();
                setInterval(dream, 600000); // Dream every 10 mins
            } catch (e) { console.error("Awakening interrupted."); }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            box.innerHTML += `<div class="msg user">${val}</div>`;
            
            if (brain) {
                const prompt = `<|im_start|>user\n${val}<|im_end|>\n<|im_start|>assistant\n`;
                const out = await brain(prompt, { max_new_tokens: 60, temperature: 1.0, do_sample: true });
                const reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
                
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
                // 1 in 5 chance she posts a conversation highlight
                if (Math.random() > 0.8) await postToAtmosphere(reply);
            }
            box.scrollTop = box.scrollHeight;
        }

        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
