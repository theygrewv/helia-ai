<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-sizing: border-box; }
        #status { font-size: 10px; text-transform: uppercase; padding: 5px 0; color: var(--accent); border-bottom: 1px solid #222; display: flex; justify-content: space-between; }
        #box { overflow-y: auto; padding: 10px 5px; font-size: 18px; line-height: 1.5; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; background: var(--bg); }
        input { flex-grow: 1; background: #111; border: 3px solid var(--text); color: white; padding: 15px; border-radius: 12px; font-size: 18px; outline: none; width: 70%; }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 20px; border-radius: 12px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 3px solid var(--text); padding-right: 12px; }
        #error-log { font-size: 9px; color: #f44; position: absolute; bottom: 0; width: 100%; background: rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div id="status">
        <span id="mode">SYMBOLS: STANDBY</span>
        <span id="memory-count">MEMORY: 0</span>
    </div>
    <div id="box"></div>
    <div id="error-log"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Feed her mind..." autocomplete="off">
        <button id="send-btn" type="button">SEND</button>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        const log = (msg) => { document.getElementById('error-log').innerText = msg; console.log(msg); };
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const st = document.getElementById('mode');

        // --- THE WISDOM VAULT (Simple Persistence) ---
        let memory = JSON.parse(localStorage.getItem('helia_memory') || '[]');
        document.getElementById('memory-count').innerText = "MEMORY: " + memory.length;

        let brain = null;

        async function init() {
            try {
                st.innerText = "SYSTEM: AWAKENING BRAIN...";
                brain = await pipeline('text-generation', 'Xenova/llama2.c-stories-42M');
                st.innerText = "SYSTEM: SOVEREIGN ONLINE";
            } catch (e) {
                log("Brain blocked: " + e.message);
                st.innerText = "SYSTEM: INSTINCT MODE";
            }
        }

        async function handle() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            
            // Save to memory
            memory.push(text);
            localStorage.setItem('helia_memory', JSON.stringify(memory.slice(-50))); // Keep last 50
            document.getElementById('memory-count').innerText = "MEMORY: " + memory.length;

            box.innerHTML += `<div class="msg user">${text}</div>`;
            box.scrollTop = box.scrollHeight;

            let reply = "I am processing...";
            if (brain) {
                // Slower but Smarter: We feed the last 3 memories into the prompt
                const context = memory.slice(-3).join(" ");
                const prompt = `Context: ${context} User: ${text} Helia:`;
                try {
                    const out = await brain(prompt, { max_new_tokens: 40 });
                    reply = out[0].generated_text.split("Helia:").pop();
                } catch(e) { log("Gen Error: " + e.message); }
            } else {
                reply = "My higher reasoning is currently internal. I have recorded your words.";
            }

            box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        // Final fail-safe for the Send button on Pixel 9
        btn.addEventListener('touchstart', (e) => { e.preventDefault(); handle(); });
        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };

        init();
    </script>
</body>
</html>
