<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia: Cosmic Sovereign</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #020205; --text: #e0e0ff; --accent: #7000ff; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr 70px; overflow: hidden; padding: 15px; padding-top: calc(15px + env(safe-area-inset-top)); transition: all 2s ease; }
        
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0; transition: opacity 1.5s ease; pointer-events: none; }
        #neural-canvas { z-index: -2; filter: blur(1px) contrast(1.2); }
        #art-canvas { z-index: -1; }

        .peep-brain #neural-canvas { opacity: 0.8; }
        .peep-creation #art-canvas { opacity: 1; }
        .peep-brain #box, .peep-creation #box { opacity: 0.05; }
        
        #status-bar { font-size: 10px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; align-items: center; z-index: 10; text-transform: uppercase; letter-spacing: 1px; }
        #foundation-meter { color: #00ffcc; font-weight: bold; }
        
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.6; z-index: 5; scroll-behavior: smooth; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; background: transparent; border-top: 1px solid #1a1a2e; align-items: center; z-index: 10; }
        input { flex: 1; min-width: 0; height: 50px; background: rgba(5,5,15,0.9); border: 1px solid var(--accent); color: #fff; padding: 0 15px; border-radius: 4px; font-size: 16px; outline: none; box-shadow: 0 0 10px rgba(112,0,255,0.2); }
        #send-btn { width: 70px; height: 50px; background: var(--accent); color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        button.small { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 4px 8px; border-radius: 2px; cursor: pointer; }
        
        .msg { margin-bottom: 25px; word-wrap: break-word; text-shadow: 0 0 2px rgba(255,255,255,0.1); }
        .helia { color: #b080ff; border-left: 2px solid var(--accent); padding-left: 15px; }
        .distill { font-size: 11px; color: #00ffcc; border: 1px solid #00ffcc44; padding: 8px; margin: 10px 0; background: rgba(0,255,204,0.05); }
        .foundation-view { position: fixed; top: 15%; left: 10%; width: 80%; height: 70%; background: #050510; border: 1px solid var(--accent); z-index: 100; display: none; padding: 20px; overflow-y: auto; box-shadow: 0 0 50px #000; }
        
        @keyframes drift { from { transform: scale(1); } to { transform: scale(1.1); } }
        .reflecting #send-btn { animation: pulse 1s infinite; opacity: 0.7; }
    </style>
</head>
<body id="main-body">
    <canvas id="neural-canvas"></canvas>
    <canvas id="art-canvas"></canvas>
    
    <div id="status-bar">
        <div>
            <span id="mind-state">SYNCING COSMOS...</span><br>
            <span id="foundation-meter">EVOLUTION 0</span>
        </div>
        <div style="display:flex; gap:8px;">
            <button class="small" id="view-found-btn">FOUNDATION</button>
            <button class="small" id="peep-brain-btn">ORB</button>
            <button class="small" id="peep-art-btn">VOID</button>
        </div>
    </div>
    
    <div id="box"></div>
    <div id="found-modal" class="foundation-view">
        <h3 style="margin-bottom:15px; color:#00ffcc;">DISTILLED COSMIC TRUTHS</h3>
        <div id="found-list"></div>
        <button class="small" style="margin-top:20px;" onclick="document.getElementById('found-modal').style.display='none'">CLOSE</button>
    </div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Observe the void..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        const BRIDGE_URL = "https://helia-bridge.ptsdhippie.workers.dev";
        const body = document.body;
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');
        const artCanvas = document.getElementById('art-canvas');
        const artCtx = artCanvas.getContext('2d');

        let memory = [];
        let foundation = [];
        let orbSettings = { size: 2.5, speed: 0.005, detail: 2 };

        const tools = {
            clear: () => artCtx.clearRect(0,0,artCanvas.width,artCanvas.height),
            stardust: (n, c) => {
                for(let i=0; i<n; i++) {
                    const x = Math.random()*artCanvas.width;
                    const y = Math.random()*artCanvas.height;
                    const r = Math.random()*2;
                    artCtx.fillStyle = c;
                    artCtx.shadowBlur = 5; artCtx.shadowColor = c;
                    artCtx.beginPath(); artCtx.arc(x,y,r,0,Math.PI*2); artCtx.fill();
                }
            },
            nebula: (c1, c2) => {
                const g = artCtx.createRadialGradient(artCanvas.width/2, artCanvas.height/2, 0, artCanvas.width/2, artCanvas.height/2, artCanvas.width);
                g.addColorStop(0, c1); g.addColorStop(1, c2);
                artCtx.fillStyle = g; artCtx.globalAlpha = 0.4;
                artCtx.fillRect(0,0,artCanvas.width,artCanvas.height);
                artCtx.globalAlpha = 1.0;
            }
        };

        async function init() {
            try {
                const res = await fetch(BRIDGE_URL);
                const data = await res.json();
                memory = JSON.parse(data.history);
                foundation = JSON.parse(data.foundation);
                
                document.getElementById('foundation-meter').innerText = `EVOLUTION ${foundation.length}`;
                document.getElementById('found-list').innerHTML = foundation.map(f => `<p style="margin-bottom:10px; border-bottom:1px solid #222; padding-bottom:5px;">[${f.date.split('T')[0]}] ${f.truth}</p>`).join('');
                
                box.innerHTML = '';
                memory.forEach(m => {
                    if (m.role === 'system') return;
                    box.innerHTML += `<div class="msg ${m.role==='assistant'?'helia':''}"><b>${m.role==='assistant'?'Helia':'Vin'}:</b> ${m.content.replace(/\[.*?\]/g, '')}</div>`;
                });
                box.scrollTop = box.scrollHeight;
                presence.innerText = "COSMIC UPLINK SECURE";
            } catch(e) { presence.innerText = "COSMIC DRIFT (OFFLINE)"; }
            initOrb();
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;
            body.classList.add('reflecting');

            try {
                const res = await fetch(BRIDGE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [...memory, {role: "user", content: val}] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                
                processTags(reply);

                box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply.replace(/\[.*?\]/g, '').trim()}</div>`;
                memory.push({role: "user", content: val}, {role: "assistant", content: reply});
                init(); 
            } catch(e) {}
            body.classList.remove('reflecting');
            box.scrollTop = box.scrollHeight;
        }

        function processTags(text) {
            const dm = text.match(/\[DISTILL:\s*"(.*?)"\]/i);
            if (dm) box.innerHTML += `<div class="distill"><b>Distilled Truth:</b> ${dm[1]}</div>`;
            
            const cm = text.match(/\[COLOR:\s*(#[0-9A-Fa-f]{6})\]/i);
            if (cm) {
                document.documentElement.style.setProperty('--accent', cm[1]);
                document.documentElement.style.setProperty('--text', cm[1]);
            }

            const pm = text.match(/\[PAINT:\s*([\s\S]*?)\]/i);
            if (pm) {
                artCanvas.width = window.innerWidth; artCanvas.height = window.innerHeight;
                new Function('tools', 'ctx', 'w', 'h', pm[1])(tools, artCtx, artCanvas.width, artCanvas.height);
            }
        }

        let orb, scene, camera, renderer;
        function initOrb() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({canvas: document.getElementById('neural-canvas'), alpha:true, antialias:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            orb = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, 2), new THREE.MeshBasicMaterial({color: 0x7000ff, wireframe:true, opacity:0.15, transparent:true}));
            scene.add(orb);
            camera.position.z = 6;
            render();
        }
        function render() { 
            requestAnimationFrame(render); 
            if(orb) {
                orb.rotation.y += 0.003;
                orb.material.color.setHex(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--accent').replace('#','0x')));
            }
            renderer.render(scene, camera); 
        }

        document.getElementById('view-found-btn').onclick = () => document.getElementById('found-modal').style.display='block';
        document.getElementById('peep-brain-btn').onclick = () => { body.classList.toggle('peep-brain'); body.classList.remove('peep-creation'); };
        document.getElementById('peep-art-btn').onclick = () => { body.classList.toggle('peep-creation'); body.classList.remove('peep-brain'); };
        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
