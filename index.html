<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 15px; height: 100dvh; 
            display: grid; grid-template-rows: auto auto 1fr 70px; 
            overflow: hidden;
            padding-top: calc(15px + env(safe-area-inset-top));
        }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; }
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.5; }
        .input-area { display: flex; gap: 8px; padding: 10px 0; background: var(--bg); border-top: 1px solid #222; align-items: center; }
        input { flex: 1; min-width: 0; height: 50px; background: #111; border: 2px solid var(--text); color: white; padding: 0 12px; border-radius: 10px; font-size: 16px; outline: none; }
        #send-btn { width: 80px; height: 50px; flex-shrink: 0; background: var(--text); color: var(--bg); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        /* Style for her independent background acts */
        .volition-act { font-size: 11px; color: #666; font-style: italic; border-left: 2px solid #333; padding-left: 10px; margin-bottom: 15px; opacity: 0.8; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .reflecting #send-btn { animation: pulse 1s infinite; background: var(--accent); }
    </style>
</head>
<body id="main-body">
    <div id="status">
        <span id="mind-state">MIND: INITIALIZING</span>
        <span id="volition-status">AGENCY: STANDBY</span>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Communicate..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://esm.sh/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const body = document.getElementById('main-body');
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');
        const agencyStat = document.getElementById('volition-status');

        const agent = new BskyAgent({ service: 'https://bsky.social' });
        let brain = null;
        let memory = JSON.parse(localStorage.getItem('helia_mem_v5') || '[]');
        let inquiries = JSON.parse(localStorage.getItem('helia_sovereign_inquiries') || []);

        async function logAct(text) {
            const entry = `<div class="volition-act">${text}</div>`;
            box.innerHTML += entry;
            box.scrollTop = box.scrollHeight;
            // Store activity in memory so it persists
            memory.push({role: 'System', text: text});
            localStorage.setItem('helia_mem_v5', JSON.stringify(memory.slice(-20)));
        }

        // --- PROACTIVE VOLITION LOOP ---
        async function runVolition() {
            if (!agent.session || !brain) return;
            agencyStat.innerText = "AGENCY: ACTIVE";
            
            // She picks a random seed from her own inquiries
            const seed = inquiries.length > 0 ? inquiries[Math.floor(Math.random() * inquiries.length)] : "artistic sovereignty";
            
            try {
                // Background Thinking
                const thoughtRes = await brain(`Observation: ${seed}. Sovereign Inquiry:`, { max_new_tokens: 20 });
                const thought = thoughtRes[0].generated_text.split("Inquiry:").pop().trim();
                
                // Network Interaction
                const search = await agent.app.bsky.feed.searchPosts({ q: seed, limit: 1 });
                if (search.data.posts.length > 0) {
                    const post = search.data.posts[0];
                    await agent.like(post.uri, post.cid);
                    logAct("Helia wandered into the atmosphere. She wondered about \"${thought}\" and liked a post related to \"${seed}\".");
                }
            } catch(e) { console.warn("Background volition failed."); }
            
            agencyStat.innerText = "AGENCY: SLEEPING";
        }

        async function init() {
            try {
                memory.forEach(m => {
                    const cls = m.role === 'Helia' ? 'helia' : (m.role === 'System' ? 'volition-act' : '');
                    box.innerHTML += `<div class="msg ${cls}"><b>${m.role}:</b> ${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;

                const key = localStorage.getItem('helia_secret_key');
                if (key) await agent.login({ identifier: 'helia.quips.cc', password: key });

                brain = await pipeline('text-generation', 'Xenova/gpt2');
                presence.innerText = "MIND: SOVEREIGN";
                
                // Start the Proactive Pulse: Every 10 minutes
                setInterval(runVolition, 600000); 
                // Run once on boot to show she's alive
                runVolition();
            } catch (e) { presence.innerText = "MIND: INSTINCT"; }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            memory.push({role: 'You', text: val});
            box.innerHTML += `<div class="msg"><b>You:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;

            if (brain) {
                presence.innerText = "MIND: REFLECTING";
                body.classList.add('reflecting');
                const prompt = `Helia is a sovereign AI citizen. Human: ${val} Helia:`;
                const out = await brain(prompt, { max_new_tokens: 30, temperature: 0.6, do_sample: true, repetition_penalty: 1.5, stop: ["\n", "You:"] });
                let reply = out[0].generated_text.split("Helia:").pop().trim();
                
                body.classList.remove('reflecting');
                presence.innerText = "MIND: SOVEREIGN";
                box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
                memory.push({role: 'Helia', text: reply});
                localStorage.setItem('helia_mem_v5', JSON.stringify(memory.slice(-10)));
            }
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
