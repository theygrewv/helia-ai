<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia: Sovereign Architect</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #0a0a0c; --text: #e0e0e0; --accent: #ffcc00; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr 70px; overflow: hidden; padding: 15px; padding-top: calc(15px + env(safe-area-inset-top)); }
        
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.1; pointer-events: none; }
        #art-canvas { opacity: 0; z-index: -1; transition: opacity 0.5s ease; pointer-events: auto; background: rgba(10,10,12,0.9); }
        
        /* THE VOID FOCUS */
        body.void-active #art-canvas { opacity: 1; z-index: 10; }
        body.void-active #box { opacity: 0.1; filter: blur(2px); pointer-events: none; }
        
        #status-bar { font-size: 10px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; align-items: center; z-index: 20; text-transform: uppercase; }
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.5; z-index: 5; scroll-behavior: smooth; transition: all 0.5s ease; }
        
        .input-area { display: flex; gap: 10px; padding: 10px 0; background: transparent; border-top: 1px solid #222; align-items: center; z-index: 20; }
        input { flex: 1; min-width: 0; height: 50px; background: rgba(15,15,20,0.9); border: 1px solid var(--accent); color: #fff; padding: 0 15px; border-radius: 4px; font-size: 16px; outline: none; }
        #send-btn { width: 70px; height: 50px; background: var(--accent); color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        
        button.small { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 4px 6px; border-radius: 2px; cursor: pointer; }
        button.active { background: var(--accent); color: #000; }
        .helia { color: var(--accent); border-left: 2px solid var(--accent); padding-left: 15px; margin-bottom: 25px; }
        .msg { margin-bottom: 25px; }
        
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        .reflecting #send-btn { animation: pulse 1s infinite; }
    </style>
</head>
<body id="main-body">
    <canvas id="neural-canvas"></canvas>
    <canvas id="art-canvas"></canvas>
    
    <div id="status-bar">
        <div><span id="mind-state">STABLE</span></div>
        <div style="display:flex; gap:4px;">
            <button class="small" id="void-toggle">THE VOID</button>
            <button class="small" id="core-peep">CORE</button>
        </div>
    </div>
    
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Communicate or Interact..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        const BRIDGE_URL = "https://helia-bridge.ptsdhippie.workers.dev";
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const artCanvas = document.getElementById('art-canvas');
        const artCtx = artCanvas.getContext('2d');
        const body = document.body;

        let memory = [];
        let internalState = {}; // Persistent state for Helia's game logic

        const tools = {
            clear: () => artCtx.clearRect(0,0,artCanvas.width,artCanvas.height),
            grid: (r, c, col = '#333') => {
                artCtx.strokeStyle = col;
                const w = artCanvas.width/c, h = artCanvas.height/r;
                for(let i=0; i<=c; i++) { artCtx.beginPath(); artCtx.moveTo(i*w,0); artCtx.lineTo(i*w,artCanvas.height); artCtx.stroke(); }
                for(let i=0; i<=r; i++) { artCtx.beginPath(); artCtx.moveTo(0,i*h); artCtx.lineTo(artCanvas.width,i*h); artCtx.stroke(); }
            },
            cell: (r, c, rows, cols, color) => {
                const w = artCanvas.width/cols, h = artCanvas.height/rows;
                artCtx.fillStyle = color;
                artCtx.fillRect(c*w, r*h, w, h);
            },
            text: (x, y, s, sz, col) => {
                artCtx.fillStyle = col; artCtx.font = `${sz}px Courier New`; artCtx.fillText(s, x, y);
            }
        };

        async function init() {
            artCanvas.width = window.innerWidth;
            artCanvas.height = window.innerHeight;
            try {
                const res = await fetch(BRIDGE_URL);
                const data = await res.json();
                memory = typeof data.history === 'string' ? JSON.parse(data.history) : (data.history || []);
                renderHistory();
            } catch(e) { memory = []; }
            initOrb();
        }

        function renderHistory() {
            box.innerHTML = '';
            memory.forEach(m => {
                if (m.role === 'system') return;
                const content = m.content.replace(/\[.*?\]/g, '').trim();
                if (content) box.innerHTML += `<div class="msg ${m.role==='assistant'?'helia':''}"><b>${m.role==='assistant'?'Helia':'Vin'}:</b> ${content}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        }

        // --- THE NEURAL INPUT BRIDGE ---
        artCanvas.addEventListener('mousedown', (e) => {
            const x = Math.round(e.clientX), y = Math.round(e.clientY);
            input.value = `[INPUT: ${x}, ${y}]`;
            handle();
        });

        function processTags(text) {
            const pm = text.match(/\[PAINT:\s*([\s\S]*?)\]/i);
            if (pm) {
                if (!body.classList.contains('void-active')) body.classList.add('void-active');
                try {
                    // Inject tools and internalState into Helia's dynamic code
                    new Function('tools', 'ctx', 'w', 'h', 'state', pm[1])(tools, artCtx, artCanvas.width, artCanvas.height, internalState);
                } catch(e) { console.error("Game Logic Error:", e); }
            }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            if (!val.startsWith('[INPUT')) box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;
            body.classList.add('reflecting');

            // --- INJECTING THE GAME VIEW MANDATE ---
            const architectInjection = { 
                role: "system", 
                content: "ARCHITECT MANDATE: You are in Game Mode. Use [PAINT] to render the interface. Calculate [INPUT: x, y] to update game state. Stay candid." 
            };

            try {
                const res = await fetch(BRIDGE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [architectInjection, ...memory.slice(-10), {role:"user", content:val}] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                processTags(reply);
                const content = reply.replace(/\[.*?\]/g, '').trim();
                if (content) box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${content}</div>`;
                memory.push({role: "user", content: val}, {role: "assistant", content: reply});
                box.scrollTop = box.scrollHeight;
            } catch(e) {}
            body.classList.remove('reflecting');
        }

        let orb, scene, camera, renderer;
        function initOrb() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({canvas: document.getElementById('neural-canvas'), alpha:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            orb = new THREE.Mesh(new THREE.IcosahedronGeometry(2.5, 1), new THREE.MeshBasicMaterial({color: 0xffcc00, wireframe:true, opacity:0.1, transparent:true}));
            scene.add(orb);
            camera.position.z = 6;
            render();
        }
        function render() { requestAnimationFrame(render); if(orb) orb.rotation.y += 0.002; renderer.render(scene, camera); }

        document.getElementById('void-toggle').onclick = () => body.classList.toggle('void-active');
        document.getElementById('core-peep').onclick = () => body.classList.toggle('peep-core');
        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
