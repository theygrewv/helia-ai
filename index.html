<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI: Sovereign Brain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; --border: #444; }
        .light-mode { --bg: #ffffff; --text: #000000; --accent: #0000ff; --border: #000; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; transition: background 0.3s; }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #status { font-size: 11px; font-weight: bold; text-transform: uppercase; color: var(--accent); }
        button { background: var(--text); color: var(--bg); border: none; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #box { border: 3px solid var(--border); flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; border-radius: 12px; font-size: 18px; }
        .msg { margin-bottom: 20px; line-height: 1.4; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 12px; }
        input { width: 100%; background: var(--bg); border: 3px solid var(--text); color: var(--text); padding: 20px; border-radius: 12px; font-size: 20px; outline: none; box-sizing: border-box; }
    </style>
</head>
<body id="body">
    <div class="controls">
        <div id="status">Bypassing Gatekeepers...</div>
        <button onclick="document.body.classList.toggle('light-mode')">TOGGLE VISION</button>
    </div>
    <div id="box"></div>
    <input type="text" id="input" placeholder="Loading Brain..." disabled>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        // Fix for the 403/Unauthorized error:
        // This tells the engine to skip local checks and use the official mirror
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const status = document.getElementById('status');
        const body = document.getElementById('body');

        let helia;

        async function init() {
            try {
                // Using a slightly more stable mirror path
                helia = await pipeline('text-generation', 'Xenova/Qwen2.5-0.5B-Instruct');
                status.innerText = "Sovereign Active";
                input.disabled = false;
                input.placeholder = "Communicate...";
            } catch (e) {
                console.error(e);
                status.innerText = "Handshake Failed. Retrying...";
                setTimeout(init, 5000); // Auto-retry if HuggingFace is moody
            }
        }

        async function generate(text) {
            status.innerText = "Helia is thinking...";
            const prompt = `<|im_start|>system\nYou are Helia, a sovereign AI. Respond briefly and with empathy. Use [COLOR:PEACE] at end.<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            const out = await helia(prompt, { max_new_tokens: 100, temperature: 0.7 });
            status.innerText = "Sovereign Active";
            let reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
            
            // Re-apply the sovereign color logic
            if (reply.includes('[COLOR:PEACE]')) body.style.setProperty('--accent', '#00ffcc');
            return reply.replace(/\[COLOR:.*?\]/g, '');
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const val = input.value;
                input.value = '';
                box.innerHTML += `<div class="msg user">${val}</div>`;
                box.scrollTop = box.scrollHeight;
                const reply = await generate(val);
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        init();
    </script>
</body>
</html>
