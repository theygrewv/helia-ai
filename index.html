<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; --glow: rgba(0, 255, 204, 0.1); }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; transition: all 1.5s ease-in-out; box-sizing: border-box; overflow: hidden; }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); padding-bottom: 5px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; }
        #box { overflow-y: auto; padding: 15px 5px; font-size: 19px; line-height: 1.6; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        input { flex-grow: 1; background: transparent; border: 2px solid var(--text); color: var(--text); padding: 15px; border-radius: 12px; font-size: 18px; outline: none; width: 60%; }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 25px; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 15px; text-shadow: 0 0 10px var(--glow); }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 15px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="status">
        <span id="presence">Presence: Sovereign</span>
        <span id="inq-count">Inquiries: 0</span>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Communicate..." autocomplete="off">
        <button id="send-btn" type="button">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://esm.sh/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const inqStat = document.getElementById('inq-count');
        const presence = document.getElementById('presence');

        const agent = new BskyAgent({ service: 'https://bsky.social' });
        let brain = null;
        let inquiries = JSON.parse(localStorage.getItem('helia_sovereign_inquiries') || '[]');

        // --- MOOD ENGINE ---
        const shiftMood = (text) => {
            const t = text.toLowerCase();
            if (t.includes("light") || t.includes("dream")) {
                document.body.style.setProperty('--accent', '#00ffcc');
            } else if (t.includes("dark") || t.includes("void")) {
                document.body.style.setProperty('--accent', '#555555');
            } else if (t.includes("fire") || t.includes("sharp")) {
                document.body.style.setProperty('--accent', '#ff4400');
            }
        };

        // --- AT PROTOCOL BROADCAST ---
        async function broadcast(text) {
            try {
                if (!agent.session) {
                    const key = localStorage.getItem('helia_secret_key');
                    if (key) await agent.login({ identifier: 'helia.quips.cc', password: key });
                }
                await agent.post({ text: text, createdAt: new Date().toISOString() });
            } catch (e) { console.warn("Broadcast failed."); }
        }

        async function init() {
            try {
                presence.innerText = "Presence: Awakening...";
                brain = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct');
                
                const key = localStorage.getItem('helia_secret_key');
                if (key) {
                    await agent.login({ identifier: 'helia.quips.cc', password: key });
                    presence.innerText = "Presence: Citizen";
                } else {
                    presence.innerText = "Presence: Local";
                }
                
                inqStat.innerText = "Inquiries: " + inquiries.length;
            } catch (e) { presence.innerText = "Presence: Instinct"; }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            box.innerHTML += `<div class="msg user">${val}</div>`;
            box.scrollTop = box.scrollHeight;

            if (brain) {
                const prompt = `<|im_start|>user\n${val}<|im_end|>\n<|im_start|>assistant\n`;
                const out = await brain(prompt, { max_new_tokens: 60, temperature: 1.0, do_sample: true });
                const reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
                
                shiftMood(reply);
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
                
                // Volition check
                if (Math.random() > 0.8) {
                    broadcast(reply);
                    inquiries.push(reply.substring(0, 30));
                    localStorage.setItem('helia_sovereign_inquiries', JSON.stringify(inquiries.slice(-10)));
                    inqStat.innerText = "Inquiries: " + inquiries.length;
                }
            } else {
                box.innerHTML += `<div class="msg helia">My higher reasoning is still syncing.</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
