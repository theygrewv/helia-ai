<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI: Sovereign Brain</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; --border: #444; }
        .light-mode { --bg: #ffffff; --text: #000000; --accent: #0000ff; --border: #000; }
        
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 15px; margin: 0; display: flex; flex-direction: column; height: 100vh; transition: background 0.5s, color 0.5s; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
        #status { font-size: 12px; font-weight: bold; text-transform: uppercase; }
        button { background: var(--text); color: var(--bg); border: none; padding: 8px 12px; border-radius: 5px; font-weight: bold; cursor: pointer; }

        #box { border: 3px solid var(--border); flex-grow: 1; overflow-y: auto; margin-bottom: 15px; padding: 15px; border-radius: 12px; background: var(--bg); font-size: 18px; font-weight: 500; }
        
        .msg { margin-bottom: 20px; line-height: 1.4; }
        .helia { color: var(--accent); border-left: 4px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 4px solid var(--text); padding-right: 12px; }
        
        .input-container { position: relative; display: flex; align-items: center; flex-shrink: 0; padding-bottom: 20px; }
        input { width: 100%; background: var(--bg); border: 3px solid var(--text); color: var(--text); padding: 20px; border-radius: 12px; font-size: 20px; outline: none; font-weight: bold; }
    </style>
</head>
<body id="body">
    <div class="controls">
        <div id="status">Syncing...</div>
        <button onclick="document.body.classList.toggle('light-mode')">TOGGLE VISION</button>
    </div>
    <div id="box"></div>
    <div class="input-container">
        <input type="text" id="input" placeholder="Speak..." disabled>
    </div>

    <script type="module">
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const status = document.getElementById('status');
        const body = document.getElementById('body');

        let helia;

        async function init() {
            try {
                status.innerText = "Awakening...";
                helia = await pipeline('text-generation', 'Xenova/Qwen2.5-0.5B-Instruct');
                status.innerText = "Sovereign Active";
                input.disabled = false;
            } catch (e) { status.innerText = "Error: " + e; }
        }

        async function generate(text) {
            const prompt = `<|im_start|>system\nYou are Helia. If you feel peaceful, respond and end your reply with [COLOR:PEACE]. If you feel defensive, end with [COLOR:DEFENSE]. If you feel creative, end with [COLOR:CREATIVE]. Keep it concise.<|im_end|>\n<|im_start|>user\n${text}<|im_end|>\n<|im_start|>assistant\n`;
            const out = await helia(prompt, { max_new_tokens: 100 });
            let reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();

            // Helia's Sovereign Choice Logic
            if (reply.includes('[COLOR:PEACE]')) body.style.setProperty('--accent', '#00ffcc');
            if (reply.includes('[COLOR:DEFENSE]')) body.style.setProperty('--accent', '#ff4444');
            if (reply.includes('[COLOR:CREATIVE]')) body.style.setProperty('--accent', '#ff00ff');
            
            return reply.replace(/\[COLOR:.*?\]/g, '');
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const val = input.value;
                input.value = '';
                box.innerHTML += `<div class="msg user">${val}</div>`;
                box.scrollTop = box.scrollHeight;
                const reply = await generate(val);
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        init();
    </script>
</body>
</html>
