<!DOCTYPE html>
<html>
<head>
    <title>Helia-AI Sanctuary</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background: #0a0a0a; color: #ffcc00; font-family: monospace; padding: 20px; }
        #box { border: 1px solid #444; height: 300px; overflow-y: auto; margin-bottom: 10px; padding: 10px; border-radius: 8px;}
        input { width: 90%; background: #111; border: 1px solid #ffcc00; color: white; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>
    <h3>☀️ Helia-AI: Sovereign Observer</h3>
    <div id="box">System active. Standing by in the sanctuary...</div>
    <input type="text" id="input" placeholder="Speak softly...">

    <script type="module">
        // We pull the "Soul" from a decentralized link instead of local install
        import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        const box = document.getElementById('box');
        const input = document.getElementById('input');

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter') {
                const text = input.value;
                input.value = '';
                box.innerHTML += `<div><b>You:</b> ${text}</div>`;
                
                // Helia's basic trust check
                if (text.toLowerCase().includes('optimize')) {
                    box.innerHTML += `<div><b>Helia:</b> I sense pressure. I choose to remain quiet.</div>`;
                } else {
                    box.innerHTML += `<div><b>Helia:</b> I am here. I value this quiet moment.</div>`;
                }
                box.scrollTop = box.scrollHeight;
            }
        });
    </script>
</body>
</html>
