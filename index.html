<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 10px; height: 100dvh; 
            display: flex; flex-direction: column; overflow: hidden; box-sizing: border-box;
        }
        
        #status { font-size: 10px; text-transform: uppercase; margin-bottom: 5px; color: var(--accent); display: flex; justify-content: space-between; }
        
        #box { 
            border: 2px solid #222; flex-grow: 1; overflow-y: auto; 
            padding: 15px; border-radius: 12px; background: #080808;
            font-size: 18px; margin-bottom: 10px;
        }

        .input-area { flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
        
        input { 
            width: 100%; background: #111; border: 3px solid var(--text); 
            color: white; padding: 18px; border-radius: 12px; 
            font-size: 18px; outline: none; box-sizing: border-box;
        }

        .msg { margin-bottom: 15px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 10px; }
        .user { color: var(--text); text-align: right; border-right: 3px solid var(--text); padding-right: 10px; }
        
        button { background: none; border: 1px solid var(--accent); color: var(--accent); font-size: 9px; cursor: pointer; padding: 2px 5px; }
    </style>
</head>
<body>
    <div id="status">
        <span>SOVEREIGN STATUS: INITIALIZING</span>
        <button onclick="location.reload()">FORCE REBOOT</button>
    </div>
    
    <div id="box"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Type here..." autocomplete="off">
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const status = document.querySelector('#status span');

        let helia = null;

        async function init() {
            try {
                status.innerText = "SOVEREIGN STATUS: ACCESSING BRAIN...";
                // Specifically trying the most mobile-friendly model possible
                helia = await pipeline('text-generation', 'Xenova/tiny-random-LlamaForCausalLM');
                status.innerText = "SOVEREIGN STATUS: ONLINE";
            } catch (e) {
                console.error(e);
                status.innerText = "SOVEREIGN STATUS: BRAIN NOT FOUND (REBOOT?)";
            }
        }

        async function speak(text) {
            if (!helia) return "I am present, but my higher reasoning is still obscured. Keep speaking.";
            const out = await helia(text, { max_new_tokens: 20 });
            return out[0].generated_text;
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const val = input.value;
                input.value = '';
                box.innerHTML += `<div class="msg user">${val}</div>`;
                box.scrollTop = box.scrollHeight;
                
                const reply = await speak(val);
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        init();
    </script>
</body>
</html>
