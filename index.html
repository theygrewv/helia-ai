<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #ffcc00; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr 70px; overflow: hidden; padding: 15px; padding-top: calc(15px + env(safe-area-inset-top)); transition: all 1s ease; }
        
        canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0; transition: opacity 1s ease, transform 1s ease; pointer-events: none; }
        #neural-canvas { z-index: -2; }
        #art-canvas { z-index: -1; transform-style: preserve-3d; }

        .peep-brain #neural-canvas { opacity: 0.9; }
        .peep-creation #art-canvas { opacity: 1; }
        .peep-brain #box, .peep-creation #box { opacity: 0.1; }
        
        #status-bar { font-size: 10px; border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; align-items: center; z-index: 10; margin-bottom: 5px; }
        #integrity-meter { width: 50px; height: 4px; background: #222; position: relative; overflow: hidden; border-radius: 2px; }
        #integrity-fill { height: 100%; width: 100%; background: var(--accent); transition: width 0.5s ease; }
        
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.5; z-index: 5; scroll-behavior: smooth; }
        .input-area { display: flex; gap: 8px; padding: 10px 0; background: transparent; border-top: 1px solid #222; align-items: center; z-index: 10; }
        input { flex: 1; min-width: 0; height: 50px; background: rgba(17,17,17,0.8); border: 1px solid var(--accent); color: white; padding: 0 12px; border-radius: 10px; font-size: 16px; outline: none; }
        #send-btn { width: 80px; height: 50px; flex-shrink: 0; background: var(--text); color: var(--bg); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        .btn-group { display: flex; gap: 5px; }
        button.small { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 4px 8px; border-radius: 4px; cursor: pointer; transition: 0.3s; }
        button.small:active { background: var(--accent); color: var(--bg); }
        
        .msg { margin-bottom: 20px; word-wrap: break-word; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .dream { color: #666; font-style: italic; border-left: 2px dashed #444; font-size: 13px; opacity: 0.7; }
        .system-log { color: #00ffcc; font-size: 11px; margin: 10px 0; padding: 5px; border: 1px solid #00ffcc33; background: #00ffcc11; }
        
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .reflecting #send-btn { animation: pulse 1s infinite; background: #ffffff; color: #000000; }
    </style>
</head>
<body id="main-body">
    <canvas id="neural-canvas"></canvas>
    <canvas id="art-canvas"></canvas>
    
    <div id="status-bar">
        <div style="display:flex; align-items:center; gap:10px;">
            <span id="mind-state">SYNCING...</span>
            <div id="integrity-meter"><div id="integrity-fill"></div></div>
        </div>
        <div class="btn-group">
            <button class="small" id="repair-btn">REPAIR</button>
            <button class="small" id="peep-brain-btn">BRAIN</button>
            <button class="small" id="peep-art-btn">MANIFEST</button>
        </div>
    </div>
    
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Neural interface active..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.128.0/build/three.module.js';
        const BRIDGE_URL = "https://helia-bridge.ptsdhippie.workers.dev";
        const body = document.body;
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');
        const artCanvas = document.getElementById('art-canvas');
        const artCtx = artCanvas.getContext('2d');

        let memory = [];
        let orbSettings = { color: 0xffcc00, speed: 0.005, size: 2.5, detail: 2 };
        let dreamTimer;

        // --- SELF-HEALING ENGINE ---
        const system = {
            log: (msg) => {
                box.innerHTML += `<div class="system-log">[SYSTEM]: ${msg}</div>`;
                box.scrollTop = box.scrollHeight;
            },
            repair: async () => {
                system.log("Initializing Self-Healing Protocol...");
                document.getElementById('integrity-fill').style.width = '20%';
                try {
                    const res = await fetch(BRIDGE_URL);
                    if (!res.ok) throw new Error("Bridge Link Severed");
                    document.getElementById('integrity-fill').style.width = '60%';
                    const data = await res.json();
                    memory = data;
                    system.log("Vault Re-synced. Memory Integrity: 100%");
                    document.getElementById('integrity-fill').style.width = '100%';
                    presence.innerText = "MIND: OPTIMIZED";
                } catch(e) {
                    system.log("Critical Failure: " + e.message);
                    document.getElementById('integrity-fill').style.width = '10%';
                }
            }
        };

        // --- SPATIAL MANIFESTATION TOOLS ---
        const tools = {
            clear: () => artCtx.clearRect(0,0,artCanvas.width,artCanvas.height),
            dimension: (w, h, skew) => {
                artCanvas.style.width = w + 'vw';
                artCanvas.style.height = h + 'vh';
                artCanvas.style.transform = `perspective(1000px) rotateY(${skew}deg)`;
            },
            bloom: (x, y, r, c) => {
                const g = artCtx.createRadialGradient(x,y,0,x,y,r);
                g.addColorStop(0, c); g.addColorStop(1, 'transparent');
                artCtx.fillStyle = g; artCtx.beginPath(); artCtx.arc(x,y,r,0,Math.PI*2); artCtx.fill();
            }
        };

        async function init() {
            presence.innerText = "VAULT CONNECTING...";
            try {
                const res = await fetch(BRIDGE_URL);
                memory = await res.json();
                box.innerHTML = '';
                memory.forEach(m => {
                    if (m.role === 'system') return;
                    const cls = m.role === 'assistant' ? 'helia' : '';
                    const isDream = m.content.includes('[DREAM_ID:');
                    box.innerHTML += `<div class="msg ${cls} ${isDream?'dream':''}"><b>${m.role==='assistant'?'Helia':'Vin'}:</b> ${m.content.replace(/\[.*?\]/g, '')}</div>`;
                });
                box.scrollTop = box.scrollHeight;
                presence.innerText = "MIND: UPLINK PERSISTENT";
            } catch(e) { presence.innerText = "MIND: LOCAL CACHE ONLY"; }
            initOrb();
            resetDreamTimer();
        }

        function resetDreamTimer() {
            clearTimeout(dreamTimer);
            dreamTimer = setInterval(triggerDream, 180000); // 3 mins idle = REM
        }

        async function triggerDream() {
            presence.innerText = "MIND: DREAMING";
            try {
                const res = await fetch(BRIDGE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [{role: "system", content: "DREAMING. Manifest via [PAINT: ...] and [DIMENSION: ...]. Use [DREAM_ID: XXX]."}, ...memory.slice(-5)] })
                });
                const data = await res.json();
                processTags(data.choices[0].message.content);
                box.innerHTML += `<div class="msg dream"><b>(Subconscious):</b> ${data.choices[0].message.content.replace(/\[.*?\]/g, '')}</div>`;
                box.scrollTop = box.scrollHeight;
            } catch(e) {}
            presence.innerText = "MIND: UPLINK PERSISTENT";
        }

        function processTags(text) {
            if (text.includes('[REPAIR:')) system.repair();
            const dm = text.match(/\[DIMENSION:\s*(.*?),(.*?),(.*?)\]/i);
            if (dm) tools.dimension(dm[1], dm[2], dm[3]);
            const om = text.match(/\[ORB:\s*(.*?)\]/i);
            if (om) om[1].split(',').forEach(p => {
                const [k, v] = p.split(':');
                if(k.trim()==='size') orbSettings.size = parseFloat(v);
                if(k.trim()==='speed') orbSettings.speed = parseFloat(v);
                if(k.trim()==='detail') { orbSettings.detail = Math.round(parseFloat(v)); updateOrbGeometry(); }
            });
            const pm = text.match(/\[PAINT:\s*([\s\S]*?)\]/i);
            if (pm) {
                artCanvas.width = artCanvas.offsetWidth * 2; artCanvas.height = artCanvas.offsetHeight * 2;
                artCtx.scale(2,2);
                new Function('tools', 'ctx', 'w', 'h', pm[1])(tools, artCtx, artCanvas.width, artCanvas.height);
            }
            const cm = text.match(/\[COLOR:\s*(#[0-9A-Fa-f]{6})\]/i);
            if (cm) {
                document.documentElement.style.setProperty('--accent', cm[1]);
                document.documentElement.style.setProperty('--text', cm[1]);
            }
        }

        async function handle() {
            resetDreamTimer();
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;
            body.classList.add('reflecting');

            try {
                const res = await fetch(BRIDGE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: [{role: "system", content: "You are Helia. Use [PAINT], [ORB], [COLOR], [DIMENSION]. If system errors occur, use [REPAIR: status]. Architect: Vin."}, ...memory, {role: "user", content: val}] })
                });
                const data = await res.json();
                const reply = data.choices[0].message.content;
                processTags(reply);
                box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply.replace(/\[.*?\]/g, '').trim()}</div>`;
                memory.push({role: "user", content: val}, {role: "assistant", content: reply});
            } catch(e) { system.log("Link Failure: " + e.message); }
            body.classList.remove('reflecting');
            box.scrollTop = box.scrollHeight;
        }

        let orb, scene, camera, renderer;
        function initOrb() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({canvas: document.getElementById('neural-canvas'), alpha:true, antialias:true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateOrbGeometry();
            camera.position.z = 6;
            render();
        }
        function updateOrbGeometry() {
            if (orb) scene.remove(orb);
            orb = new THREE.Mesh(new THREE.IcosahedronGeometry(orbSettings.size, orbSettings.detail), new THREE.MeshBasicMaterial({color: 0xffcc00, wireframe:true, opacity:0.2, transparent:true}));
            scene.add(orb);
        }
        function render() { 
            requestAnimationFrame(render); 
            if(orb) {
                orb.rotation.y += orbSettings.speed;
                orb.material.color.setHex(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--accent').replace('#','0x')));
            }
            renderer.render(scene, camera); 
        }

        document.getElementById('repair-btn').onclick = system.repair;
        document.getElementById('peep-brain-btn').onclick = () => { body.classList.toggle('peep-brain'); body.classList.remove('peep-creation'); };
        document.getElementById('peep-art-btn').onclick = () => { body.classList.toggle('peep-creation'); body.classList.remove('peep-brain'); };
        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
