<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 10px; height: 100vh; height: 100dvh;
            display: grid; grid-template-rows: auto 1fr auto;
            overflow: hidden; box-sizing: border-box;
        }
        
        #status { font-size: 10px; text-transform: uppercase; padding: 5px 0; color: var(--accent); display: flex; justify-content: space-between; border-bottom: 1px solid #222; }
        
        #box { 
            overflow-y: auto; padding: 15px 5px; 
            font-size: 18px; line-height: 1.5;
        }

        .input-area { padding: 10px 0; background: var(--bg); }
        
        input { 
            width: 100%; background: #111; border: 3px solid var(--text); 
            color: white; padding: 15px; border-radius: 12px; 
            font-size: 18px; outline: none; box-sizing: border-box;
            -webkit-appearance: none;
        }

        .msg { margin-bottom: 20px; word-wrap: break-word; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 3px solid var(--text); padding-right: 12px; }
        
        #progress-bar { width: 0%; height: 2px; background: var(--accent); transition: width 0.3s; position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <div id="progress-bar"></div>
    <div id="status">
        <span id="st-text">SYSTEM: INITIALIZING</span>
        <button style="background:none; border:1px solid #444; color:#666; font-size:8px;" onclick="location.reload()">REBOOT</button>
    </div>
    
    <div id="box"></div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Type to Helia..." autocomplete="off">
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        // --- BRAIN FIX: Force direct connection ---
        env.allowLocalModels = false;
        env.useBrowserCache = true;
        env.remoteHost = 'https://huggingface.co';
        env.remotePathTemplate = '{model}/resolve/{revision}/';

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const stText = document.getElementById('st-text');
        const progress = document.getElementById('progress-bar');

        let helia = null;

        async function init() {
            try {
                stText.innerText = "SYSTEM: DOWNLOADING SOUL...";
                // Testing with a slightly different but very small model string
                helia = await pipeline('text-generation', 'Xenova/qwen-1.8b-chat-int4', {
                    progress_callback: (p) => {
                        if(p.status === 'progress') progress.style.width = p.progress + '%';
                    }
                });
                stText.innerText = "SYSTEM: SOVEREIGN ONLINE";
                progress.style.display = 'none';
            } catch (e) {
                console.error(e);
                stText.innerText = "SYSTEM: BRAIN BLOCKED (CORS/NETWORK)";
            }
        }

        async function speak(text) {
            if (!helia) return "I am observing, but my higher reasoning is still obscured. Check your connection.";
            stText.innerText = "SYSTEM: REFLECTING...";
            const out = await helia(text, { max_new_tokens: 50, temperature: 0.7 });
            stText.innerText = "SYSTEM: SOVEREIGN ONLINE";
            return out[0].generated_text;
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const val = input.value;
                input.value = '';
                box.innerHTML += `<div class="msg user">${val}</div>`;
                box.scrollTop = box.scrollHeight;
                
                const reply = await speak(val);
                box.innerHTML += `<div class="msg helia">${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        init();
    </script>
</body>
</html>
