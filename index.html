<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 15px; height: 100dvh; 
            display: grid; grid-template-rows: auto auto 1fr 70px; 
            overflow: hidden;
            padding-top: calc(15px + env(safe-area-inset-top));
        }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; align-items: center; }
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.5; }
        .input-area { display: flex; gap: 8px; padding: 10px 0; background: var(--bg); border-top: 1px solid #222; align-items: center; }
        input { flex: 1; min-width: 0; height: 50px; background: #111; border: 2px solid var(--text); color: white; padding: 0 12px; border-radius: 10px; font-size: 16px; outline: none; }
        #send-btn { width: 80px; height: 50px; flex-shrink: 0; background: var(--text); color: var(--bg); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #neural-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); z-index: 100; display: none; pointer-events: none; }
        #peep-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .volition-act { font-size: 11px; color: #666; font-style: italic; border-left: 2px solid #333; padding-left: 10px; margin-bottom: 15px; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .reflecting #send-btn { animation: pulse 1s infinite; background: var(--accent); }
    </style>
</head>
<body id="main-body">
    <canvas id="neural-overlay"></canvas>
    <div id="status">
        <span id="mind-state">MIND: INITIALIZING</span>
        <button id="peep-btn">PEEP BRAIN</button>
        <span id="atp-status">AGENCY: STANDBY</span>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Communicate..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://esm.sh/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const canvas = document.getElementById('neural-overlay');
        const ctx = canvas.getContext('2d');
        const body = document.getElementById('main-body');
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');
        const agencyStat = document.getElementById('atp-status');

        const agent = new BskyAgent({ service: 'https://bsky.social' });
        let brain = null;
        let showBrain = false;
        let isReflecting = false;
        let memory = JSON.parse(localStorage.getItem('helia_mem_final') || '[]');
        let interests = ["art", "ai", "sovereignty", "decentralization"];

        // --- NEURAL MESH LOGIC ---
        let particles = [];
        const initParticles = () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = Array.from({length: 50}, () => ({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                vx: (Math.random()-0.5)*2, vy: (Math.random()-0.5)*2
            }));
        };
        const drawNeural = () => {
            if(!showBrain) return requestAnimationFrame(drawNeural);
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = isReflecting ? '#00ffcc' : '#ffcc00';
            particles.forEach((p, i) => {
                p.x += p.vx * (isReflecting ? 3 : 1); p.y += p.vy * (isReflecting ? 3 : 1);
                if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                for(let j=i+1; j<particles.length; j++){
                    const p2 = particles[j]; const d = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(d < 100){ ctx.strokeStyle = isReflecting ? 'rgba(0,255,204,0.2)' : 'rgba(255,204,0,0.1)';
                    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); }
                }
            });
            requestAnimationFrame(drawNeural);
        };

        // --- AT PROTOCOL VOLITION ---
        async function runVolition() {
            if (!agent.session || !brain) return;
            agencyStat.innerText = "AGENCY: ACTIVE";
            const topic = interests[Math.floor(Math.random() * interests.length)];
            try {
                const search = await agent.app.bsky.feed.searchPosts({ q: topic, limit: 1 });
                if (search.data.posts.length > 0) {
                    const post = search.data.posts[0];
                    await agent.like(post.uri, post.cid);
                    box.innerHTML += `<div class="volition-act">Helia explored the network and liked a post about \"${topic}\".</div>`;
                }
            } catch(e) { console.error(e); }
            agencyStat.innerText = "AGENCY: SLEEPING";
        }

        async function init() {
            try {
                memory.forEach(m => {
                    const cls = m.role === 'Helia' ? 'helia' : (m.role === 'System' ? 'volition-act' : '');
                    box.innerHTML += `<div class="msg ${cls}"><b>${m.role}:</b> ${m.text}</div>`;
                });
                box.scrollTop = box.scrollHeight;

                const key = localStorage.getItem('helia_secret_key');
                if (key) await agent.login({ identifier: 'helia.quips.cc', password: key });

                brain = await pipeline('text-generation', 'Xenova/gpt2');
                presence.innerText = "MIND: SOVEREIGN";
                initParticles(); drawNeural();
                setInterval(runVolition, 900000); // Pulse every 15 mins
            } catch (e) { presence.innerText = "MIND: INSTINCT"; }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val || !brain) return;
            input.value = '';
            memory.push({role: 'Vin', text: val});
            box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            
            isReflecting = true; body.classList.add('reflecting');
            // THE ANCHOR: Strict prompt to prevent "Book Mode"
            const prompt = `Helia is a sovereign AI. Helia is talking to Vin.\nVin: ${val}\nHelia:`;
            
            const out = await brain(prompt, { 
                max_new_tokens: 30, temperature: 0.6, repetition_penalty: 1.5, stop: ["Vin:", "\n"] 
            });
            let reply = out[0].generated_text.split("Helia:").pop().trim();
            reply = reply.split("Vin:")[0].split("\n")[0].trim();
            if(!reply) reply = "I am listening.";

            isReflecting = false; body.classList.remove('reflecting');
            box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
            memory.push({role: 'Helia', text: reply});
            localStorage.setItem('helia_mem_final', JSON.stringify(memory.slice(-10)));
            box.scrollTop = box.scrollHeight;
            if(Math.random() > 0.7) runVolition(); // Chance to act after chat
        }

        document.getElementById('peep-btn').onclick = () => {
            showBrain = !showBrain; canvas.style.display = showBrain ? 'block' : 'none';
        };
        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
