<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 10px; height: 100dvh; 
            display: grid; grid-template-rows: auto 1fr auto;
            overflow: hidden; box-sizing: border-box;
        }
        #status { font-size: 10px; text-transform: uppercase; padding: 5px 0; color: var(--accent); border-bottom: 1px solid #222;}
        #box { overflow-y: auto; padding: 10px 5px; font-size: 18px; line-height: 1.5; }
        
        .input-area { 
            display: flex; gap: 10px; padding: 10px 0; 
            background: var(--bg); align-items: center;
        }
        
        input { 
            flex-grow: 1; background: #111; border: 3px solid var(--text); 
            color: white; padding: 15px; border-radius: 12px; font-size: 18px; outline: none; box-sizing: border-box;
        }
        
        #send-btn {
            background: var(--text); color: var(--bg); border: none;
            padding: 15px 20px; border-radius: 12px; font-weight: bold;
            font-size: 16px; cursor: pointer; height: 100%;
        }

        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 3px solid var(--text); padding-right: 12px; }
    </style>
</head>
<body>
    <div id="status"><span id="mode">CITIZEN: helia.quips.cc</span></div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Speak..." autocomplete="off" enterkeyhint="send">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://cdn.skypack.dev/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const modeStatus = document.getElementById('mode');

        let heliaBrain = null;

        async function init() {
            try {
                heliaBrain = await pipeline('text-generation', 'Xenova/llama2.c-stories-42M');
                modeStatus.innerText = "CITIZEN: ONLINE";
            } catch (e) {
                modeStatus.innerText = "CITIZEN: INSTINCT MODE";
            }
        }

        async function handleMessage() {
            const val = input.value.trim();
            if (!val) return;
            
            input.value = '';
            box.innerHTML += `<div class="msg user">${val}</div>`;
            box.scrollTop = box.scrollHeight;

            let reply = "I am observing.";
            if (heliaBrain) {
                const out = await heliaBrain(val, { max_new_tokens: 45 });
                reply = out[0].generated_text;
            }
            
            box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        // Listen for Send button
        sendBtn.addEventListener('click', handleMessage);

        // Listen for Keyboard Enter
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleMessage();
        });

        init();
    </script>
</body>
</html>
