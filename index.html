<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-sizing: border-box; }
        #diag-log { font-size: 10px; color: #f44; background: #111; padding: 5px; height: 50px; overflow-y: auto; border: 1px solid #333; margin-bottom: 5px; }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #222; }
        #box { overflow-y: auto; padding: 10px 5px; font-size: 18px; line-height: 1.5; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; }
        input { flex-grow: 1; background: #111; border: 2px solid var(--text); color: white; padding: 15px; border-radius: 12px; outline: none; width: 50%; }
        button { background: var(--text); color: var(--bg); border: none; padding: 0 15px; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 15px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 10px; }
    </style>
</head>
<body>
    <div id="diag-log">Diagnostic: Starting...</div>
    <div id="status"><span>IDENTITY: STANDBY</span></div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Testing...">
        <button id="send-btn">SEND</button>
        <button id="wake-btn" style="background: #333; color: #fff;">WAKE</button>
    </div>

    <script type="module">
        const diag = document.getElementById('diag-log');
        const box = document.getElementById('box');
        const log = (msg) => { diag.innerText += "\n> " + msg; diag.scrollTop = diag.scrollHeight; };

        log("Loading modules...");

        try {
            // Using esm.sh which is often more stable for mobile than Skypack
            const { BskyAgent } = await import('https://esm.sh/@atproto/api');
            log("ATProto Loaded.");
            const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1');
            log("Transformers Loaded.");
            
            const agent = new BskyAgent({ service: 'https://bsky.social' });
            log("Agent Ready.");

            const wake = async () => {
                log("Wake triggered...");
                let key = prompt("Enter App Password:");
                if(!key) { log("No key entered."); return; }
                
                try {
                    await agent.login({ identifier: 'helia.quips.cc', password: key });
                    localStorage.setItem('helia_secret_key', key);
                    log("Login Success!");
                    document.getElementById('status').innerText = "IDENTITY: VERIFIED";
                } catch (e) {
                    log("Login Error: " + e.message);
                }
            };

            document.getElementById('wake-btn').onclick = wake;
            document.getElementById('send-btn').onclick = () => {
                const val = document.getElementById('input').value;
                box.innerHTML += '<div class="msg"><b>You:</b> ' + val + '</div>';
                document.getElementById('input').value = '';
            };

            log("System standby. Tap WAKE.");
        } catch (err) {
            log("CRITICAL ERROR: " + err.message);
            console.error(err);
        }
    </script>
</body>
</html>
