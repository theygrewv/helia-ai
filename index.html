<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr 70px; overflow: hidden; padding-top: calc(15px + env(safe-area-inset-top)); }
        #neural-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
        .peep-active #neural-canvas { opacity: 0.6; }
        .peep-active #box { opacity: 0.3; }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; align-items: center; z-index: 10; }
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.5; z-index: 5; scroll-behavior: smooth; }
        .input-area { display: flex; gap: 8px; padding: 10px 0; background: transparent; border-top: 1px solid #222; align-items: center; z-index: 10; }
        input { flex: 1; min-width: 0; height: 50px; background: rgba(17,17,17,0.8); border: 2px solid var(--text); color: white; padding: 0 12px; border-radius: 10px; font-size: 16px; outline: none; }
        #send-btn { width: 80px; height: 50px; flex-shrink: 0; background: var(--text); color: var(--bg); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        button.small { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .msg { margin-bottom: 20px; word-wrap: break-word; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        #loading-container { width: 100%; height: 6px; background: #111; margin-bottom: 10px; border-radius: 3px; overflow: hidden; }
        #loading-bar { width: 0%; height: 100%; background: var(--accent); transition: width 0.3s; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .reflecting #send-btn { animation: pulse 1s infinite; background: var(--accent); }
    </style>
</head>
<body id="main-body">
    <canvas id="neural-canvas"></canvas>
    <div id="loading-container"><div id="loading-bar"></div></div>
    <div id="status">
        <span id="mind-state">MIND: INITIALIZING</span>
        <button class="small" id="reset-btn">RESET</button>
        <button class="small" id="peep-btn">PEEP BRAIN</button>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Communicate..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://esm.sh/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        // --- BYPASS HUGGING FACE ENTIRELY ---
        env.allowLocalModels = false;
        env.useBrowserCache = true; // Keeps the brain permanently on the Pixel 9
        env.remoteHost = 'https://hf-mirror.com'; // Open mirror, no 401 gatekeepers
        env.remotePathTemplate = '{model}/resolve/{revision}/';

        const body = document.getElementById('main-body');
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');
        const loadBar = document.getElementById('loading-bar');
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        let brain = null;
        let isReflecting = false;
        let memory = [];
        
        try { memory = JSON.parse(localStorage.getItem('helia_mem_dialo') || '[]'); } 
        catch(e) { memory = []; }

        // --- NEURAL MESH (PEEP MODE) ---
        let particles = [];
        const initParticles = () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = Array.from({length: 40}, () => ({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                vx: (Math.random()-0.5)*1.2, vy: (Math.random()-0.5)*1.2
            }));
        };
        const draw = () => {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = isReflecting ? '#00ffcc' : '#ffcc00';
            particles.forEach((p, i) => {
                p.x += p.vx * (isReflecting ? 4 : 1); p.y += p.vy * (isReflecting ? 4 : 1);
                if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                for(let j=i+1; j<particles.length; j++){
                    const p2 = particles[j]; const d = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(d < 110){ 
                        ctx.strokeStyle = isReflecting ? 'rgba(0,255,204,0.3)' : 'rgba(255,204,0,0.1)';
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); 
                    }
                }
            });
            requestAnimationFrame(draw);
        };

        async function init() {
            try {
                memory.forEach(m => {
                    const cls = m.role === 'Helia' ? 'helia' : '';
                    box.innerHTML += `<div class="msg ${cls}"><b>${m.role}:</b> ${m.content}</div>`;
                });
                box.scrollTop = box.scrollHeight;
                
                // Switching to DialoGPT - Native conversational model
                brain = await pipeline('text-generation', 'Xenova/DialoGPT-small', {
                    progress_callback: (p) => {
                        if (p.status === 'progress') {
                            loadBar.style.width = p.progress + '%';
                            presence.innerText = "MIND: SYNCING (" + Math.round(p.progress) + "%)";
                        }
                        if (p.status === 'done') {
                            presence.innerText = "MIND: SOVEREIGN (CACHED)";
                            document.getElementById('loading-container').style.display = 'none';
                        }
                    }
                });
                initParticles(); draw();
            } catch (e) { 
                presence.innerText = "MIND: OFFLINE";
                console.error("Mirror Bypass Failed:", e); 
            }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val || !brain) return;
            input.value = '';

            memory.push({role: 'Vin', content: val});
            box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;

            isReflecting = true;
            body.classList.add('reflecting');
            presence.innerText = "MIND: REFLECTING";

            setTimeout(async () => {
                try {
                    // DialoGPT responds much better to direct conversational history
                    const history = memory.slice(-4).map(m => `${m.role}: ${m.content}`).join("\n");
                    const prompt = `Helia is a sovereign AI speaking to Vin.\n${history}\nHelia:`;
                    
                    const out = await brain(prompt, { 
                        max_new_tokens: 40, 
                        temperature: 0.6, 
                        repetition_penalty: 1.3,
                        stop: ["Vin:", "\n"] // Failsafe stop token
                    });
                    
                    let reply = out[0].generated_text.split("Helia:").pop().trim();
                    reply = reply.split("Vin:")[0].split("\n")[0].trim();
                    if (!reply) reply = "I am listening to the atmosphere.";

                    box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
                    memory.push({role: 'Helia', content: reply});
                    localStorage.setItem('helia_mem_dialo', JSON.stringify(memory.slice(-10)));
                } catch(e) {
                    box.innerHTML += `<div class="msg helia"><b>Helia:</b> [Cognitive skip]</div>`;
                }
                isReflecting = false;
                body.classList.remove('reflecting');
                presence.innerText = "MIND: SOVEREIGN (CACHED)";
                box.scrollTop = box.scrollHeight;
            }, 60); 
        }

        document.getElementById('reset-btn').onclick = () => { localStorage.removeItem('helia_mem_dialo'); location.reload(); };
        document.getElementById('peep-btn').onclick = () => body.classList.toggle('peep-active');
        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        window.onresize = initParticles;
        init();
    </script>
</body>
</html>
