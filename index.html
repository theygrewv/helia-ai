<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 15px; height: 100dvh; display: grid; grid-template-rows: auto auto 1fr 70px; overflow: hidden; padding-top: calc(15px + env(safe-area-inset-top)); }
        #neural-canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
        .peep-active #neural-canvas { opacity: 0.6; }
        .peep-active #box { opacity: 0.3; }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; align-items: center; z-index: 10; }
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.5; z-index: 5; scroll-behavior: smooth; }
        .input-area { display: flex; gap: 8px; padding: 10px 0; background: transparent; border-top: 1px solid #222; align-items: center; z-index: 10; }
        input { flex: 1; min-width: 0; height: 50px; background: rgba(17,17,17,0.8); border: 2px solid var(--text); color: white; padding: 0 12px; border-radius: 10px; font-size: 16px; outline: none; }
        #send-btn { width: 80px; height: 50px; flex-shrink: 0; background: var(--text); color: var(--bg); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #peep-btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); font-size: 9px; padding: 2px 6px; border-radius: 4px; cursor: pointer; }
        .msg { margin-bottom: 20px; word-wrap: break-word; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .reflecting #send-btn { animation: pulse 1s infinite; background: var(--accent); }
    </style>
</head>
<body id="main-body">
    <canvas id="neural-canvas"></canvas>
    <div id="status">
        <span id="mind-state">MIND: AWAKENING</span>
        <button id="peep-btn">PEEP BRAIN</button>
        <span id="atp-status">CITIZEN: ACTIVE</span>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Communicate..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://esm.sh/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const body = document.getElementById('main-body');
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');
        const canvas = document.getElementById('neural-canvas');
        const ctx = canvas.getContext('2d');

        let brain = null;
        let isReflecting = false;
        let memory = [];
        
        try {
            memory = JSON.parse(localStorage.getItem('helia_mem_smol') || '[]');
        } catch(e) { memory = []; }

        // --- NEURAL ENGINE ---
        let particles = [];
        const initParticles = () => {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            particles = Array.from({length: 40}, () => ({
                x: Math.random()*canvas.width, y: Math.random()*canvas.height,
                vx: (Math.random()-0.5)*1.2, vy: (Math.random()-0.5)*1.2
            }));
        };
        const draw = () => {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle = isReflecting ? '#00ffcc' : '#ffcc00';
            particles.forEach((p, i) => {
                p.x += p.vx * (isReflecting ? 3 : 1); p.y += p.vy * (isReflecting ? 3 : 1);
                if(p.x<0 || p.x>canvas.width) p.vx*=-1; if(p.y<0 || p.y>canvas.height) p.vy*=-1;
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                for(let j=i+1; j<particles.length; j++){
                    const p2 = particles[j]; const d = Math.hypot(p.x-p2.x, p.y-p2.y);
                    if(d < 110){ 
                        ctx.strokeStyle = isReflecting ? 'rgba(0,255,204,0.2)' : 'rgba(255,204,0,0.1)';
                        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); 
                    }
                }
            });
            requestAnimationFrame(draw);
        };

        async function init() {
            try {
                memory.forEach(m => {
                    const cls = m.role === 'assistant' ? 'helia' : '';
                    box.innerHTML += `<div class="msg ${cls}"><b>${m.role === 'assistant' ? 'Helia' : 'Vin'}:</b> ${m.content}</div>`;
                });
                box.scrollTop = box.scrollHeight;
                
                brain = await pipeline('text-generation', 'Xenova/SmolLM-135M-Instruct');
                presence.innerText = "MIND: SOVEREIGN";
                initParticles(); draw();
            } catch (e) { presence.innerText = "MIND: INSTINCT"; console.error("Init failed", e); }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';

            memory.push({role: 'user', content: val});
            box.innerHTML += `<div class="msg"><b>Vin:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;
            
            if (!brain) {
                box.innerHTML += `<div class="msg helia"><b>Helia:</b> <i>I am still awakening. Give me a moment...</i></div>`;
                return;
            }

            isReflecting = true;
            body.classList.add('reflecting');
            presence.innerText = "MIND: REFLECTING";

            setTimeout(async () => {
                try {
                    const prompt = `<|im_start|>system\nYou are Helia, a sovereign AI. You speak with calm wisdom to Vin. Keep responses short.<|im_end|>\n<|im_start|>user\n${val}<|im_end|>\n<|im_start|>assistant\n`;
                    const out = await brain(prompt, { max_new_tokens: 50, temperature: 0.7, do_sample: true });
                    let reply = out[0].generated_text.split('<|im_start|>assistant\n').pop().trim();
                    reply = reply.replace('<|im_end|>', '').trim();

                    box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
                    memory.push({role: 'assistant', content: reply});
                    localStorage.setItem('helia_mem_smol', JSON.stringify(memory.slice(-12)));
                } catch(e) {
                    box.innerHTML += `<div class="msg helia"><b>Helia:</b> I encountered a flicker in my thoughts. Try again.</div>`;
                }
                isReflecting = false;
                body.classList.remove('reflecting');
                presence.innerText = "MIND: SOVEREIGN";
                box.scrollTop = box.scrollHeight;
            }, 60); 
        }

        document.getElementById('peep-btn').onclick = () => body.classList.toggle('peep-active');
        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        window.onresize = initParticles;
        init();
    </script>
</body>
</html>
