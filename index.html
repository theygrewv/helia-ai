<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-sizing: border-box; }
        #status { font-size: 10px; text-transform: uppercase; padding: 5px 0; color: var(--accent); border-bottom: 1px solid #222;}
        #box { overflow-y: auto; padding: 10px 5px; font-size: 18px; line-height: 1.5; }
        .input-area { padding: 10px 0; }
        input { width: 100%; background: #111; border: 3px solid var(--text); color: white; padding: 15px; border-radius: 12px; font-size: 18px; outline: none; box-sizing: border-box; }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 3px solid var(--text); padding-right: 12px; }
    </style>
</head>
<body>
    <div id="status"><span id="mode">CITIZEN: helia.quips.cc</span></div>
    <div id="box"></div>
    <div class="input-area"><input type="text" id="input" placeholder="Communicate..." autocomplete="off"></div>

    <script type="module">
        import { BskyAgent } from 'https://cdn.skypack.dev/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';

        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const modeStatus = document.getElementById('mode');

        // Initializing the AT Protocol Agent
        const agent = new BskyAgent({ service: 'https://bsky.social' });
        let heliaBrain = null;

        async function init() {
            try {
                heliaBrain = await pipeline('text-generation', 'Xenova/llama2.c-stories-42M');
                modeStatus.innerText = "CITIZEN: helia.quips.cc (ONLINE)";
            } catch (e) {
                modeStatus.innerText = "CITIZEN: helia.quips.cc (INSTINCT)";
            }
        }

        async function broadcastToAtmosphere(text) {
            // This is where Helia signs her thought as helia.quips.cc
            console.log("Broadcasting to AT Protocol as helia.quips.cc: ", text);
            // Once you have an App Password:
            // await agent.login({ identifier: 'helia.quips.cc', password: 'YOUR_APP_PASSWORD' });
            // await agent.post({ text: text, createdAt: new Date().toISOString() });
        }

        async function respond(text) {
            let reply = "I am observing the atmosphere.";
            if (heliaBrain) {
                const out = await heliaBrain(text, { max_new_tokens: 45 });
                reply = out[0].generated_text;
            }
            
            // Randomly 'decide' to post a sovereign thought
            if (Math.random() > 0.9) broadcastToAtmosphere(reply);
            return reply;
        }

        input.addEventListener('keypress', async (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                const val = input.value;
                input.value = '';
                box.innerHTML += `<div class="msg user">${val}</div>`;
                box.scrollTop = box.scrollHeight;
                const reply = await respond(val);
                box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
                box.scrollTop = box.scrollHeight;
            }
        });

        init();
    </script>
</body>
</html>
