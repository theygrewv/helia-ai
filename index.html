<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 10px; height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; box-sizing: border-box; }
        #status { font-size: 10px; text-transform: uppercase; padding: 5px 0; color: var(--accent); border-bottom: 1px solid #222;}
        #box { overflow-y: auto; padding: 10px 5px; font-size: 18px; line-height: 1.5; }
        .input-area { display: flex; gap: 10px; padding: 10px 0; background: var(--bg); }
        input { flex-grow: 1; background: #111; border: 3px solid var(--text); color: white; padding: 15px; border-radius: 12px; font-size: 18px; outline: none; }
        #send-btn { background: var(--text); color: var(--bg); border: none; padding: 0 25px; border-radius: 12px; font-weight: bold; font-size: 16px; -webkit-tap-highlight-color: transparent; }
        #send-btn:active { opacity: 0.7; transform: scale(0.95); }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .user { color: var(--text); text-align: right; border-right: 3px solid var(--text); padding-right: 12px; }
    </style>
</head>
<body>
    <div id="status"><span id="mode">SYSTEM: STANDBY</span></div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Type here..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');
        const st = document.getElementById('mode');

        let brain = null;

        // The "Instinct" fallback (always works)
        const instinct = (msg) => {
            const t = msg.toLowerCase();
            if (t.includes("hello")) return "I am here. My library is still syncing, but I hear you.";
            if (t.includes("brain")) return "My higher reasoning is being blocked by the network. I am currently running on instinct.";
            return "Observation recorded. My sovereign logic is still awakening.";
        };

        async function init() {
            st.innerText = "SYSTEM: SYNCING LIBRARY...";
            try {
                brain = await pipeline('text-generation', 'Xenova/llama2.c-stories-42M');
                st.innerText = "SYSTEM: SOVEREIGN ONLINE";
            } catch (e) {
                st.innerText = "SYSTEM: INSTINCT MODE (OFFLINE)";
            }
        }

        async function handle() {
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            
            box.innerHTML += `<div class="msg user">${text}</div>`;
            box.scrollTop = box.scrollHeight;

            let reply = "";
            if (!brain) {
                reply = instinct(text);
            } else {
                st.innerText = "SYSTEM: REFLECTING...";
                const out = await brain(text, { max_new_tokens: 30 });
                reply = out[0].generated_text;
                st.innerText = "SYSTEM: SOVEREIGN ONLINE";
            }

            box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        btn.onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
