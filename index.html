<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Helia-AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover">
    <style>
        :root { --bg: #050505; --text: #ffcc00; --accent: #00ffcc; }
        * { box-sizing: border-box; }
        body { 
            background: var(--bg); color: var(--text); font-family: sans-serif; 
            margin: 0; padding: 15px; height: 100dvh; 
            display: grid; grid-template-rows: auto auto 1fr 70px; 
            overflow: hidden;
            padding-top: calc(10px + env(safe-area-inset-top));
        }
        #status { font-size: 10px; text-transform: uppercase; color: var(--accent); border-bottom: 1px solid var(--accent); display: flex; justify-content: space-between; padding-bottom: 5px; }
        #box { overflow-y: auto; padding: 10px 0; font-size: 18px; line-height: 1.5; }
        .input-area { display: flex; gap: 8px; padding: 10px 0; background: var(--bg); border-top: 1px solid #222; align-items: center; }
        input { flex: 1; min-width: 0; height: 50px; background: #111; border: 2px solid var(--text); color: white; padding: 0 12px; border-radius: 10px; font-size: 16px; outline: none; }
        #send-btn { width: 80px; height: 50px; flex-shrink: 0; background: var(--text); color: var(--bg); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .msg { margin-bottom: 20px; }
        .helia { color: var(--accent); border-left: 3px solid var(--accent); padding-left: 12px; }
        .reflecting #send-btn { background: var(--accent); animation: pulse 1.5s infinite ease; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body id="main-body">
    <div id="status">
        <span id="mind-state">MIND: INITIALIZING</span>
        <span id="atp-status">CITIZEN: ACTIVE</span>
    </div>
    <div id="box"></div>
    <div class="input-area">
        <input type="text" id="input" placeholder="Communicate..." autocomplete="off">
        <button id="send-btn">SEND</button>
    </div>

    <script type="module">
        import { BskyAgent } from 'https://esm.sh/@atproto/api';
        import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1';
        
        env.allowLocalModels = false;
        env.useBrowserCache = true;

        const body = document.getElementById('main-body');
        const box = document.getElementById('box');
        const input = document.getElementById('input');
        const presence = document.getElementById('mind-state');

        let brain = null;

        async function init() {
            try {
                brain = await pipeline('text-generation', 'Xenova/gpt2');
                presence.innerText = "MIND: SOVEREIGN";
            } catch (e) { presence.innerText = "MIND: ERROR"; }
        }

        async function handle() {
            const val = input.value.trim();
            if (!val) return;
            input.value = '';
            box.innerHTML += `<div class="msg"><b>You:</b> ${val}</div>`;
            box.scrollTop = box.scrollHeight;

            if (brain) {
                presence.innerText = "MIND: REFLECTING";
                body.classList.add('reflecting');

                // We anchor her identity with a "Persona" block
                const persona = "Helia is a helpful, calm, and sovereign AI for artists. She speaks in short, meaningful sentences.";
                const prompt = `${persona}\nHuman: ${val}\nHelia:`;

                const out = await brain(prompt, { 
                    max_new_tokens: 40, 
                    temperature: 0.6, // Lower temperature = less "crazy"
                    do_sample: true,
                    repetition_penalty: 1.5, // Stop her from repeating "I don't know"
                    stop: ["Human:", "\n"] // Kill the generation if she tries to play as you
                });
                
                let reply = out[0].generated_text.split("Helia:").pop().trim();
                reply = reply.split("Human:")[0].split("\n")[0].trim(); // Double-check hard stops
                
                if (!reply) reply = "I am reflecting on your words in the silence.";

                body.classList.remove('reflecting');
                presence.innerText = "MIND: SOVEREIGN";
                box.innerHTML += `<div class="msg helia"><b>Helia:</b> ${reply}</div>`;
            }
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('send-btn').onclick = handle;
        input.onkeypress = (e) => { if (e.key === 'Enter') handle(); };
        init();
    </script>
</body>
</html>
